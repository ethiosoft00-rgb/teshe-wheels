function changeLanguage(lang) {
    CURRENT_LANG = lang;
    localStorage.setItem('lw_lang', lang);
    document.getElementById('langSelector').value = lang;
    translateUI();
}

function translateUI() {
    if (CURRENT_LANG === 'en') {
        document.querySelectorAll('[data-en]').forEach(el => {
            el.innerHTML = el.getAttribute('data-en');
        });
        return;
    }
    const dict = translations[CURRENT_LANG] || {};
    document.querySelectorAll('[data-en]').forEach(el => {
        const key = el.getAttribute('data-en');
        if (dict[key]) el.textContent = dict[key];
    });
    document.querySelectorAll('.nav').forEach(btn => {
        const originalText = btn.getAttribute('data-en');
        if (!originalText) return;
        const match = originalText.match(/^([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])\s*(.*)$/);
        if(match && dict[match[2]]) btn.textContent = match[1] + ' ' + dict[match[2]];
        else if (dict[originalText]) btn.textContent = dict[originalText];
    });
    document.querySelectorAll('label, h1, h2, h3, small, p.muted, b, span').forEach(el => {
        const text = el.textContent.trim();
        if (dict[text]) el.textContent = dict[text];
    });
}

function toast(msg, isError = false) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 4500);
}

function confirmToast(msg, { title = 'Confirm', okText = 'Confirm', cancelText = 'Cancel' } = {}) {
    return new Promise((resolve) => {
        const area = document.getElementById('modalArea');
        area.innerHTML = `
            <div class="custom-modal" onclick="if(event.target===this){this.remove();}">
                <div class="custom-modal-box">
                    <h3>${escapeHTML(title)}</h3>
                    <p class="muted" style="margin-bottom:15px;line-height:1.5">${escapeHTML(msg)}</p>
                    <div class="btn-row">
                        <button class="main-button" id="confirmYes">${escapeHTML(okText)}</button>
                        <button class="main-button" style="background:#64748b;color:white" id="confirmNo">${escapeHTML(cancelText)}</button>
                    </div>
                </div>
            </div>`;
        const cleanup = (v) => { area.innerHTML = ''; resolve(v); };
        document.getElementById('confirmYes').onclick = () => cleanup(true);
        document.getElementById('confirmNo').onclick = () => cleanup(false);
    });
}

function promptModal(title, { placeholder = '', type = 'text', okText = 'Submit' } = {}) {
    return new Promise((resolve) => {
        const area = document.getElementById('modalArea');
        area.innerHTML = `
            <div class="custom-modal" onclick="if(event.target===this){this.remove();}">
                <div class="custom-modal-box">
                    <h3>${escapeHTML(title)}</h3>
                    <input id="modalInput" type="${type}" placeholder="${escapeHTML(placeholder)}">
                    <div class="btn-row">
                        <button class="main-button" id="modalOk">${escapeHTML(okText)}</button>
                        <button class="main-button" style="background:#64748b;color:white" id="modalCancel">Cancel</button>
                    </div>
                </div>
            </div>`;
        const cleanup = (v) => { area.innerHTML = ''; resolve(v); };
        const input = document.getElementById('modalInput');
        setTimeout(() => input.focus(), 80);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') cleanup(input.value); });
        document.getElementById('modalOk').onclick = () => cleanup(input.value);
        document.getElementById('modalCancel').onclick = () => cleanup(null);
    });
}

async function api(path, options = {}) {
    let res;
    try {
        res = await fetch(API + path, {
            method: options.method || 'GET',
            headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) },
            body: options.body ? JSON.stringify(options.body) : undefined
        });
    } catch (err) { throw new Error('Network error. Is the backend server running?'); }
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;

function formatTime(s) {

}

            if (!groups[rawKey]) groups[rawKey] = { unique_id: t.batch_id || ('TICKET-' + num), round: t.round_number || 1, numbers: [], sold_date: t.sold_date || t.created_at || new Date().toISOString(), branch_name: t.branch_name, branch_code: t.branch_code, branch_telegram: t.branch_telegram };

            if (!groups[rawKey]) groups[rawKey] = { unique_id: t.batch_id || ('NB-R' + t.round_number), round: t.round_number || 1, numbers: [], sold_date: t.created_at || t.sold_date || new Date().toISOString(), branch_name: t.branch_name, branch_code: t.branch_code, branch_telegram: t.branch_telegram };

        }, 100);
    }
}

async function handleFileUpload(event) {
    const file = event.target.files[0]; 
    if (!file) return;
    
    const resultDiv = document.getElementById('qr-file-result'); 
    resultDiv.innerHTML = '<p class="muted">Processing image... please wait.</p>';
    
    const img = new Image();
    img.onload = async () => {
        if ('BarcodeDetector' in window) {
            try {
                const barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
                const barcodes = await barcodeDetector.detect(img);
                if (barcodes.length > 0) {
                    renderSuccessUI(barcodes[0].rawValue, resultDiv);
                    return;
                }
            } catch (e) { console.warn('Native BarcodeDetector failed, falling back to jsQR', e); }
        }

        const canvas = document.createElement('canvas'); 
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const MAX_SIZE = 1500; 
        let width = img.width; 
        let height = img.height;
        
        if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
        else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
        
        const MIN_SIZE = 600;
        if (width < MIN_SIZE && height < MIN_SIZE) {
            const scale = MIN_SIZE / Math.min(width, height);
            width *= scale; height *= scale;
        }

        canvas.width = width; canvas.height = height; 
        ctx.drawImage(img, 0, 0, width, height);
        
        const imageData = ctx.getImageData(0, 0, width, height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            const avg = (data[i] + data[i+1] + data[i+2]) / 3;
            const val = avg < 110 ? 0 : 255; 
            data[i] = val; data[i+1] = val; data[i+2] = val;
        }
        ctx.putImageData(imageData, 0, 0);

        const attemptScan = () => {
            const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
            return code ? code.data : null;
        };

        try {
            let qrText = attemptScan();
            
            if (!qrText) {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                const rotations = [90, 180, 270];
                
                for (let angle of rotations) {
                    tempCanvas.width = height;
                    tempCanvas.height = width;
                    tempCtx.translate(height / 2, width / 2);
                    tempCtx.rotate(angle * Math.PI / 180);
                    tempCtx.drawImage(canvas, -width / 2, -height / 2);
                    const rotData = tempCtx.getImageData(0, 0, height, width);
                    const rotCode = jsQR(rotData.data, rotData.width, rotData.height, { inversionAttempts: "attemptBoth" });
                    if (rotCode) { qrText = rotCode.data; break; }
                }
            }

            if (qrText) {
                renderSuccessUI(qrText, resultDiv);
                return;
            }

            resultDiv.innerHTML = '<p class="muted">QR not found. Scanning text (OCR) as fallback... this may take 3-5 seconds.</p>';
            
            try {
                const worker = await Tesseract.createWorker('eng');
                const ret = await worker.recognize(file);
                await worker.terminate();
                
                let text = ret.data.text.toUpperCase().replace(/\s+/g, '');
                text = text.replace(/O/g, '0').replace(/I/g, '1').replace(/L/g, '1');
                
                const match = text.match(/(TICKET\d+|LW[A-Z0-9]+|NB[A-Z0-9]+)/);
                
                if (match) {
                    renderSuccessUI(match[0], resultDiv);
                } else {
                    resultDiv.innerHTML = `
                        <div class="req-card" style="border-color:#fbbf24; background:#2a200c; margin-bottom:10px;">
                            <p style="color:#fcd34d; font-weight:bold; font-size:16px;">⚠️ Could not detect QR or text automatically.</p>
                            <p style="font-size:13px; margin-top:5px; line-height:1.4; color:#fff;">
                                The image might be blurry or the QR code is damaged. 
                                <br><br>
                                <b>Please type the Ticket ID below:</b>
                            </p>
                            <input id="manual-ocr-input" placeholder="e.g. TICKET-5 or LW-A1B2C3" style="width:100%; padding:10px; margin-top:10px; border-radius:6px; border:1px solid #475569; background:#0b1220; color:white;">
                            <button class="main-button" style="background:#fbbf24; color:#111827; margin-top:10px;" onclick="doVerify(document.getElementById('manual-ocr-input').value.trim())">
                                🔍 SUBMIT & VERIFY
                            </button>
                        </div>
                    `;
                }
            } catch (ocrErr) {
                console.error("OCR Error:", ocrErr);
                resultDiv.innerHTML = `<p style="color:#f87171">❌ Error processing image. Please use Manual ID.</p>`;
            }

        } catch (err) {
            resultDiv.innerHTML = '<p style="color:#f87171">❌ Error processing image.</p>';
        }
    };
    img.onerror = () => { resultDiv.innerHTML = '<p style="color:#f87171">❌ Failed to load image.</p>'; };
    img.src = URL.createObjectURL(file);
}

function renderSuccessUI(text, div) {
    const safeTextForOnclick = JSON.stringify(text).replace(/"/g, '&quot;');
    div.innerHTML = `
        <div class="req-card" style="border-color:#4ade80; margin-bottom:10px; background:#0f172a;">
            <p style="color:#4ade80; font-weight:bold; font-size:16px;">✅ QR Code Detected!</p>
            <p style="font-family:monospace; color:#0ea5e9; word-break:break-all; margin-top:5px;">${escapeHTML(text)}</p>
        </div>
        <button class="main-button" style="background:#22c55e; color:white;" onclick='doVerify(${safeTextForOnclick})'>
            🔍 SUBMIT & VERIFY
        </button>
    `;
}

async function doVerify(input) {
    if (!input) { toast('Enter a ticket number or ID', true); return; }
    const btn = document.querySelector('#main .main-button'); 
    if (btn) { btn.textContent = 'Verifying...'; btn.disabled = true; }
    const resultDiv = document.getElementById('verifyResult'); 
    if (resultDiv) resultDiv.innerHTML = '<p class="muted">🔍 Checking database...</p>';

    try {
        let res = null;
        let serverErr = null;
        try {
            res = await api('/verify-ticket', {
                method: 'POST',
                body: { ticketNumber: input, unique_id: input, includePastRounds: true }
            });
        } catch (e) { serverErr = e; }

        if (!res || !res.unique_id) {
            const hist = await scanHistoryForTicket(input);
            if (hist) res = hist;
        }

        if (!res) {
            if (resultDiv) resultDiv.innerHTML =
                '<div class="req-card" style="border-color:#ef4444; background:#7f1d1d">' +
                '<h3 style="color:#fca5a5">❌ Ticket Not Found</h3>' +
                '<p>The ID or number you entered does not exist in any round (current or past).</p></div>';
            return;
        }

        const myBranch = getMyBranch();
        if (myBranch) {
            const ticketBranchId = res.branch_id != null ? String(res.branch_id) : null;
            if (ticketBranchId !== null && ticketBranchId !== String(myBranch.id)) {
                if (resultDiv) resultDiv.innerHTML = `
                    <div class="req-card" style="border-color:#ef4444; background:#7f1d1d">
                        <div style="font-size:44px;text-align:center">🚫</div>
                        <h3 style="color:#fca5a5;text-align:center;margin-bottom:8px">NOT THIS BRANCH'S TICKET</h3>
                        <p style="text-align:center">This ticket belongs to <b>${escapeHTML(res.branch_name || 'another branch')}</b>, not <b>${escapeHTML(myBranch.name)}</b>.</p>
                        <p class="muted" style="text-align:center;margin-top:6px;font-size:12px">Please verify only tickets issued by your branch.</p>
                    </div>`;
                return;
            }
        }

        let html = '<div class="req-card" style="border-color:#4ade80; background:#0f172a">';
        html += '<h3 style="color:#4ade80; margin-bottom:10px">✅ Ticket Matched (Valid)</h3>';
        if (res.branch_name) html += '<div class="row"><b>Branch:</b> <span>' + escapeHTML(res.branch_name) + '</span></div>';
        html += '<div class="row"><b>Game:</b> <span>' + escapeHTML(res.game) + '</span></div>';
        html += '<div class="row"><b>Ticket ID (Ref):</b> <span style="font-family:monospace; color:#0ea5e9">' + escapeHTML(res.unique_id) + '</span></div>';
        html += '<div class="row"><b>Numbers:</b> <span class="gold">' + (res.numbers || []).map(n => '#'+n).join(' ') + '</span></div>';
        html += '<div class="row"><b>Round:</b> <span>#' + res.round + (res.round_is_past ? ' <small class="muted">(past round)</small>' : '') + '</span></div>';
        html += '<div class="row"><b>Owner:</b> <span>' + escapeHTML(res.owner_name || '—') + '</span></div>';
        html += '<div class="row"><b>Date:</b> <span>' + formatDate(res.sold_date) + '</span></div>';

        if (res.status === 'winner') {
            html += `<div class="verify-status winner" style="animation: bounceIn 0.6s ease;">
                <div class="congrats-burst">🎉</div>
                <h3>CONGRATULATIONS!</h3>
                <div class="prize">${money(res.prize)}</div>
                <p style="font-size:15px; margin-bottom:5px;">You are a <b>WINNER</b> in Round #${res.round}!</p>
                ${res.match_count > 0 ? `<p style="font-size:13px; opacity:0.9">Matched <b>${res.match_count}</b> winning number(s).</p>` : ''}
                ${res.winning_numbers && res.winning_numbers.length ? `<p style="font-size:12px;opacity:.85;margin-top:6px">Winning numbers: ${res.winning_numbers.map(n=>'#'+n).join(' ')}</p>` : ''}
                <small>Prize has been credited. ${res.round_is_past ? 'This was a past round.' : ''}</small>
            </div>`;
        } else if (res.status === 'not_winner') {
            html += `<div class="verify-status not_winner" style="animation: shake 0.5s ease;">
                <div style="font-size: 50px; margin-bottom: 5px;">😔</div>
                <h3>SORRY, NOT A WINNER</h3>
                <p style="font-size:15px; margin-bottom:5px;">Round #${res.round} ${res.round_is_past ? 'has ended' : 'is finished'}.</p>
                ${res.match_count > 0 ? `<p style="font-size:13px; color:#fca5a5;">Matched <b>${res.match_count}</b> number(s), not enough this time.</p>` : ''}
                ${res.winning_numbers && res.winning_numbers.length ? `<p style="font-size:12px;opacity:.85;margin-top:6px">Winning numbers: ${res.winning_numbers.map(n=>'#'+n).join(' ')}</p>` : ''}
                <small>Try again in the next round — good luck! 🍀</small>
            </div>`;
        } else if (res.status === 'progress') {
            html += `<div class="verify-status progress" style="animation: pulse 2s infinite;">
                <div style="font-size: 50px; margin-bottom: 5px;">⏳</div>
                <h3>ROUND IN PROGRESS</h3>
                <p style="font-size:15px; margin-bottom:5px;">Draw for Round #${res.round} has not finished yet.</p>
                <small>Please wait for the draw to complete.</small>
            </div>`;
        } else if (res.status === 'pending') {
            html += `<div class="verify-status progress" style="animation: pulse 2s infinite;">
                <div style="font-size: 50px; margin-bottom: 5px;">⏳</div>
                <h3>TICKET NOT YET PLAYED</h3>
                <p style="font-size:15px;">Round #${res.round} has not started drawing yet.</p>
            </div>`;
        } else if (res.status === 'past_round') {
            html += `<div class="verify-status past_round">
                <div style="font-size: 50px; margin-bottom: 5px;">📜</div>
                <h3>PAST ROUND</h3>
                <p style="font-size:15px;">Round #${res.round} has ended. No winner record found.</p>
            </div>`;
        }

        html += '</div>';
        if (resultDiv) resultDiv.innerHTML = html;
    } catch (e) {
        if (resultDiv) resultDiv.innerHTML = '<div class="req-card" style="border-color:#ef4444; background:#7f1d1d"><h3 style="color:#fca5a5">❌ Error</h3><p>' + escapeHTML(e.message) + '</p></div>';
    }
    finally { if (btn) { btn.textContent = '🔍 VERIFY TICKET'; btn.disabled = false; } }
}

async function scanHistoryForTicket(input) {
    const needle = String(input).trim().toUpperCase();
    const isNumeric = /^\d+$/.test(needle);

    try {
        const w = await api('/rounds');
        for (const r of (w.rounds || [])) {
            const tickets = r.tickets || [];
            const match = tickets.find(t => {
                const uid = String(t.batch_id || t.unique_id || '').toUpperCase();
                const num = String(t.ticket_number ?? t.number ?? '');
                return uid === needle || (isNumeric && num === needle);
            });
            if (match) {
                const uid = match.batch_id || match.unique_id || ('TICKET-' + match.ticket_number);
                const winner = (r.winners || []).find(w => String(w.ticket) === String(match.ticket_number));
                const status = r.status === 'finished' ? (winner ? 'winner' : 'not_winner')
                             : (r.status === 'spinning' ? 'progress' : 'pending');
                return {
                    game: 'Lucky Wheel',
                    round: r.round_number,
                    round_is_past: r.round_number !== SETTINGS.round_number,
                    unique_id: uid,
                    numbers: [match.ticket_number],
                    owner_name: match.owner_name || match.user_name,
                    sold_date: match.sold_date || r.created_at,
                    status,
                    prize: winner ? winner.prize : 0,
                    match_count: winner ? 1 : 0,
                    winning_numbers: r.winner_numbers || [],
                    branch_id: match.branch_id,
                    branch_name: match.branch_name
                };
            }
        }
    } catch (e) {}

    try {
        const nb = await api('/nb/rounds');
        for (const r of (nb.rounds || [])) {
            const tickets = r.tickets || [];
            const match = tickets.find(t => {
                const uid = String(t.batch_id || t.unique_id || '').toUpperCase();
                const num = String(t.number ?? t.ticket_number ?? '');
                return uid === needle || (isNumeric && num === needle);
            });
            if (match) {
                const uid = match.batch_id || ('NB-R' + r.round_number);
                const winner = (r.winners || []).find(w => (w.shown_numbers || []).includes(match.number));
                const status = r.status === 'finished' ? (winner ? 'winner' : 'not_winner')
                             : (r.status === 'drawing' ? 'progress' : 'pending');
                return {
                    game: 'Number Betting',
                    round: r.round_number,
                    round_is_past: true,
                    unique_id: uid,
                    numbers: [match.number],
                    owner_name: match.owner_name || match.user_name,
                    sold_date: match.created_at || r.created_at,
                    status,
                    prize: winner ? winner.prize : 0,
                    match_count: winner ? winner.matches : 0,
                    winning_numbers: r.winning_numbers || [],
                    branch_id: match.branch_id,
                    branch_name: match.branch_name
                };
            }
        }
    } catch (e) {}

    return null;
}

async function saveBranch(id) {
    const name = document.getElementById('bName').value.trim();
    const code = document.getElementById('bCode').value.trim().toUpperCase();
    const admin_phone = document.getElementById('bPhone').value.trim();
    const password = document.getElementById('bPassword').value;
    const holder_name = document.getElementById('bHolder').value.trim();
    const telegram_link = document.getElementById('bTelegram').value.trim();
    const cbe_account = document.getElementById('bCbe').value.trim();
    const boa_account = document.getElementById('bBoa').value.trim();

    if (!name || !admin_phone || (!id && !code)) { toast('Please fill required fields', true); return; }

    try {
        let res;
        if (id) {
            res = await api('/admin/branches/' + id, { method: 'PUT', body: { name, admin_phone, password, cbe_account, boa_account, holder_name, telegram_link } });
            toast('✅ Branch updated');

function buyRenderWheel() {
    const open = SETTINGS.sales_state === 'open'; 
    const seen = new Set(); 
    const list = [];
    for (const t of TICKETS) { 
        if (seen.has(t.ticket_number)) continue; 
        seen.add(t.ticket_number); 
        list.push(t); 
    }
    list.sort((a, b) => a.ticket_number - b.ticket_number); 
    let grid = '';
    for (const t of list) {
        // CORRECT LOGIC: Check if user_id is present to mark as sold
        const owners = TICKETS.filter(x => 
            Number(x.ticket_number) === Number(t.ticket_number) && 
            x.user_id // Only consider it owned if user_id exists
        );
        const mine = owners.some(x => String(x.user_id) === String(ME.id));
        let cls = 'ticket-select'; 
        if (mine) cls += ' mine'; 
        else if (owners.length > 0) cls += ' sold';
        let label = 'AVAILABLE'; 
        if (mine) label = 'YOURS (' + owners.length + ')'; 
        else if (owners.length > 0) label = 'SOLD';
        grid += '<button type="button" class="' + cls + '" onclick="selectBuy(' + t.ticket_number + ', this)">#' + 
                t.ticket_number + '<br><small>' + label + '</small></button>';
    }

function enterPublicViewWheel() { document.body.classList.add('public-view', 'wheel-public'); setTimeout(() => { const board = document.querySelector('.wheel-container'); if (board) board.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100); }
function buildWheel() {
    const wheel = document.getElementById('wheel'); const labels = document.getElementById('wheelLabels'); if (!wheel || !labels) return;
    const seen = new Set(); const sold = [];
    for (const t of TICKETS) { if (!t.user_id && !t.user_name && !t.phone) continue; if (seen.has(t.ticket_number)) continue; seen.add(t.ticket_number); sold.push(t); }
    sold.sort((a, b) => a.ticket_number - b.ticket_number);
    const n = sold.length;
    if (n === 0) { wheel.style.background = '#334155'; labels.innerHTML = '<div style="position:absolute;inset:0;display:flex;justify-content:center;align-items:center;color:#94a3b8;font-size:16px">No tickets sold</div>'; return; }
    const angle = 360 / n; const winners = SETTINGS.round_state === 'finished' ? (SETTINGS.winner_numbers || []) : []; const stops = [];
    for (let i = 0; i < n; i++) { const t = sold[i]; const s = i * angle, e = (i + 1) * angle; let c; if (winners.includes(t.ticket_number)) c = '#fbbf24'; else if (i % 2) c = 'hsl(' + ((t.ticket_number * 37) % 360) + ', 62%, 38%)'; else c = 'hsl(' + ((t.ticket_number * 37) % 360) + ', 55%, 27%)'; stops.push(c + ' ' + s + 'deg ' + e + 'deg'); }
    wheel.style.background = 'conic-gradient(from 0deg,' + stops.join(',') + ')';
    const fs = Math.max(9, Math.min(22, 250 / n)); let html = '';
    for (let i = 0; i < n; i++) { const t = sold[i]; const rot = i * angle + angle / 2; const isW = winners.includes(t.ticket_number); html += '<div class="wl" style="transform:rotate(' + rot + 'deg)"><span style="font-size:' + fs + 'px;color:' + (isW?'#111827':'#fff') + '">#' + t.ticket_number + '</span></div>'; }
    labels.innerHTML = html;
}

function applyWheelState() {
    const wheel = document.getElementById('wheel'); if (!wheel) return;
    const s = SETTINGS; const target = Number(s.target_rotation || 0);
    const timerEl = document.getElementById('timer'); if (!timerEl) return;

    let spinDuration = Number(s.duration_seconds);
    if (!spinDuration || spinDuration < 10) spinDuration = 30; 

    if (s.round_state === 'spinning') {
        let startedAt = new Date(s.spin_started_at).getTime();
        
        if (isNaN(startedAt)) {
             api('/spin/settle', { method: 'POST' }).then(() => refreshState().then(() => renderPage())).catch(() => {});
             return;
        }

        const spinKey = s.round_number + ':' + s.spin_started_at;

        if (!wheel._hasSpunForRound || wheel._spinKey !== spinKey) {
            wheel._spinKey = spinKey;
            wheel._hasSpunForRound = true;
            
            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            void wheel.offsetWidth; 

            setTimeout(() => {
                wheel.style.transition = `transform ${spinDuration}s cubic-bezier(0.1, 0.8, 0.2, 1)`;
                wheel.style.transform = `rotate(${360 * 15 + target + 180}deg)`;

                setTimeout(() => {
                    api('/spin/settle', { method: 'POST' }).then(() => {
                        refreshState().then(() => renderPage());
                    }).catch(() => {});
                }, (spinDuration * 1000) + 1000);
            }, 50);

            const pointer = document.getElementById('topPointer'); if (pointer) pointer.classList.remove('winner');
            const center = document.getElementById('wheelCenter'); if (center) center.textContent = 'SPINNING';
        }

        timerEl.classList.remove('sales'); timerEl.classList.add('spinning');
        startCountdown(startedAt, spinDuration); 
        return;
    }

    if (s.round_state === 'idle' && s.sales_state === 'open') {
        timerEl.classList.remove('spinning'); timerEl.classList.add('sales');
        startSalesCountdown(new Date(s.sales_started_at).getTime(), s.sales_duration || 120);
        const center = document.getElementById('wheelCenter'); if (center) center.textContent = 'READY';
        return;
    }

    if (s.round_state === 'idle' && s.sales_state !== 'open') {
        stopCountdown();
        if (window._autoRestartTimer) { clearTimeout(window._autoRestartTimer); window._autoRestartTimer = null; }
        wheel._spinKey = null;
        wheel._hasSpunForRound = false;
        wheel.style.transition = 'none';
        wheel.style.transform = 'rotate(0deg)';
        const pointer = document.getElementById('topPointer'); if (pointer) pointer.classList.remove('winner');
        const center = document.getElementById('wheelCenter'); if (center) center.textContent = 'SPIN';
        const area = document.getElementById('winnerArea'); if (area) area.innerHTML = '';
        timerEl.classList.remove('spinning', 'sales');
        timerEl.textContent = formatTime(spinDuration);
        return;
    }

    if (s.round_state === 'finished') {
        stopCountdown();
        timerEl.classList.remove('spinning', 'sales');
        wheel._spinKey = null;
        wheel.style.transition = 'none';
        wheel.style.transform = `rotate(${target + 180}deg)`;
        const pointer = document.getElementById('topPointer'); if (pointer) pointer.classList.add('winner');
        const winners = s.winner_numbers || [];
        const center = document.getElementById('wheelCenter');
        if (center) center.innerHTML = winners.length ? `🏆<br>#${winners[0]}` : 'DONE';
        timerEl.textContent = '00:00';
        const statusEl = document.getElementById('status'); if (statusEl) statusEl.textContent = 'Round completed.';

        showWinners(s.winners || []);

        if (!window._autoRestartTimer) {
            window._autoRestartTimer = setTimeout(() => {
                window._autoRestartTimer = null;
                if (SETTINGS.round_state === 'finished') {
                    newRound();
                }
            }, 10000);
        }
        return;
    }
}

function startSalesCountdown(startedAtTimestamp, min) {
    if (countdownId) clearInterval(countdownId);
    const dur = min * 60;
    
    const elapsed = (Date.now() - startedAtTimestamp) / 1000;
    if (elapsed > dur || elapsed < -10) {
        api('/admin/round/reset', { method: 'POST' }).then(() => {
            refreshState().then(() => renderPage());
        }).catch(() => {});
        return;
    }

    const tick = () => {
        const elapsed = (Date.now() - startedAtTimestamp) / 1000;
        const rem = Math.max(0, Math.ceil(dur - elapsed));
        const el = document.getElementById('timer');
        if (el) el.textContent = formatTime(rem);
        if (rem <= 0) {
            clearInterval(countdownId);
            countdownId = null;
            api('/admin/close-sales', { method: 'POST' }).then(() => {
                refreshState().then(() => renderPage());
            }).catch(() => {});
        }
    };
    tick();
    countdownId = setInterval(tick, 500);
}

function startCountdown(startedAtTimestamp, dur) {
    if (countdownId) clearInterval(countdownId);
    let settled = false;
    
    const tick = () => {
        const elapsed = (Date.now() - startedAtTimestamp) / 1000;
        const rem = Math.max(0, Math.ceil(dur - elapsed));
        
        const el = document.getElementById('timer'); 
        if (el) el.textContent = formatTime(rem);
        
        if (rem <= 0 && !settled) {
            settled = true;
            clearInterval(countdownId);
            countdownId = null;
            api('/spin/settle', { method: 'POST' }).then(() => {
                refreshState().then(() => renderPage());
            }).catch(() => {});
        }
    };
    tick();
    countdownId = setInterval(tick, 200);
}

function stopCountdown() { if (countdownId) { clearInterval(countdownId); countdownId = null; } }

    const c = await promptModal('Rejection reason (optional)', { okText: 'Reject', placeholder: 'Reason...' });
    if (c === null) return;
    comment = c;
  }
  try {
    await api('/admin/deposits/' + id + '/decide', { method: 'POST', body: { action, comment } });
    toast(action === 'approve' ? '✅ Deposit APPROVED' : '✅ Deposit REJECTED');
    await refreshState();
    requestsPage();
  } catch (e) { toast('❌ ' + e.message, true); }
}

        <div class="custom-modal-box">
            <h3>${escapeHTML(title)}</h3>

                <button class="main-button" style="background:#64748b;color:white" onclick="closeCustomModal()">Cancel</button>
            </div>
        </div>
    </div>`;
    setTimeout(() => {
        const inp = document.getElementById('modalInput');
        if (inp) inp.focus();
    }, 100);

function closeCustomModal() {
    _modalCallback = null;
    document.getElementById('modalArea').innerHTML = '';
}
async function submitModal() {

}

async function decideMessage(id, status) {
    try {
        await api('/admin/messages/decide', { method: 'POST', body: { id, status } });
        toast(`✅ Message ${status}`);
        refreshState();
        messagesPage();
    } catch (e) { toast('❌ ' + e.message, true); }
}

let _msgScreenshotData = {};
function previewMsgScreenshot(input, msgId) {
    const box = document.getElementById('payShotPreview_' + msgId); _msgScreenshotData[msgId] = null; box.innerHTML = '';
    const file = input.files && input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => { _msgScreenshotData[msgId] = e.target.result; box.innerHTML = '<img src="' + e.target.result + '" style="max-width:100%;max-height:220px;border-radius:8px;border:1px solid #334155">'; };
    reader.readAsDataURL(file);
}

async function submitPaymentConfirmation(msgId) {
    const account_number = document.getElementById('payAcc_' + msgId).value.trim();
    const holder_name = document.getElementById('payHolder_' + msgId).value.trim();
    const transaction_id = document.getElementById('payTxn_' + msgId).value.trim();
    const screenshot = _msgScreenshotData[msgId] || null;

    if (!account_number || !holder_name) { toast('Please fill Account Number and Holder Name', true); return; }
    if (!transaction_id && !screenshot) { toast('Provide a Transaction ID or Screenshot', true); return; }

    try {
        await api('/admin/messages', { method: 'POST', body: {
            message: 'Payment confirmation sent.',
            account_number, holder_name, transaction_id, screenshot,
            request_id: msgId
        }});
        toast('✅ Payment details sent to Main Admin');
        refreshState();
        messagesPage();
    } catch (e) { toast('❌ ' + e.message, true); }
}

async function sendMessage() {
    const msg = document.getElementById('msgText').value.trim();
    if (!msg) { toast('Enter a message', true); return; }
    try {
        await api('/admin/messages', { method: 'POST', body: { message: msg } });
        toast('✅ Message sent to Main Admin');
        refreshState();
        messagesPage();
    } catch (e) { toast('❌ ' + e.message, true); }
}

async function auditPage() {
    const data = await api('/admin/audit');
    const branches = data.branches;
    const logs = data.auditLog;

    const dates = Object.keys(logs).sort((a, b) => new Date(b) - new Date(a));

    let html = `<h1 class="title" data-en="📋 Audit & Checklist">📋 Audit & Checklist</h1>`;
    html += `<div class="card" style="overflow-x:auto;"><table><thead><tr><th>Date</th>`;
    for (const b of branches) html += `<th style="text-align:center">${escapeHTML(b.name)}<br><small class="muted" style="font-weight:normal">(Dep / Sales / Profit)</small></th>`;
    html += `</tr></thead><tbody>`;

    if (!dates.length) {
        html += `<tr><td colspan="${branches.length + 1}" class="muted" style="text-align:center">No records yet.</td></tr>`;
    } else {
        for (const date of dates) {
            html += `<tr><td style="font-weight:bold">${date}</td>`;
            for (const b of branches) {
                const record = logs[date][b.id];
                if (record && (record.deposit_amt > 0 || record.sales_amt > 0 || record.payout_amt > 0)) {
                    const net = record.sales_amt - record.payout_amt;
                    html += `<td style="text-align:center; font-size:12px; line-height:1.4;">
                        <div style="color:#0ea5e9">Dep: ${money(record.deposit_amt)}</div>
                        <div style="color:#fbbf24">Sales: ${money(record.sales_amt)}</div>
                        <div style="color:${net >= 0 ? '#4ade80' : '#f87171'}; font-weight:bold">Profit: ${money(net)}</div>
                    </td>`;
                } else {
                    html += `<td style="text-align:center; color:#475569;">—</td>`;
                }
            }
            html += `</tr>`;
        }
    }

    html += `</tbody></table></div>`;
    document.getElementById('main').innerHTML = html;
    translateUI();
}

function settingsScopeBanner() {
    if (!ME) return '';
    if (ME.role === 'branch') {
        return `<div class="scope-banner branch">
            🏢 Editing settings for <b>${escapeHTML(ME.branch_name || ME.name || 'your branch')}</b> only.
            Your changes will <b>not</b> affect other branches or the main admin.
        </div>`;
    }
    return `<div class="scope-banner global">
        🌐 Editing <b>GLOBAL</b> settings — used by the main admin's own rounds.
        Each branch can override these with their own settings.
    </div>`;
}

async function settingsPage() {
    let nbs = null; try { nbs = await api('/nb/config'); } catch (e) {}
    document.getElementById('main').innerHTML = `<img src="${IMG.settings}" class="banner-img" onerror="this.style.display='none'"><h1 class="title">⚙️ ${ME.role === 'branch' ? 'Branch Settings' : 'Settings'}</h1>${settingsScopeBanner()}<div class="game-tabs"><button class="game-tab ${settingsGame==='wheel'?'active':''}" onclick="settingsSwitchGame('wheel')">🎡 Wheel</button><button class="game-tab ${settingsGame==='nb'?'active':''}" onclick="settingsSwitchGame('nb')">🎰 NB</button></div><div id="settingsContent"></div>`;
    if (settingsGame === 'wheel') renderWheelSettings(); else renderNBSettings(nbs);
}
function settingsSwitchGame(g) { if (settingsGame === g) return; settingsGame = g; settingsPage(); }

function renderWheelSettings() {
    const wc = SETTINGS.winner_count || 1; const pcts = SETTINGS.prize_percents || []; let inputs = '';
    for (let i = 0; i < wc; i++) { const v = pcts[i] !== undefined ? pcts[i] : (i === 0 ? 50 : i === 1 ? 30 : 10); inputs += '<label>Winner #' + (i + 1) + ' — % of revenue</label><input class="pct-input" type="number" min="0" max="100" value="' + v + '">'; }

    const isMainAdmin = ME.role === 'main_admin' || ME.role === 'admin';
    const passwordHtml = isMainAdmin ? `
        <div class="card" style="border-color:#dc2626; margin-top:20px;">
            <h2 style="color:#dc2626">🔐 Change Admin Password</h2>
            <label>New Password</label>
            <input id="newAdminPw" type="password">
            <label>Secret Reset Code</label>
            <input id="resetCode" type="password">
            <button type="button" class="main-button" style="background:#dc2626;color:white" onclick="changeAdminPassword('')">🔐 Change Password</button>
        </div>` : '';

    document.getElementById('settingsContent').innerHTML = `
    <div class="card">
        <h2>🎡 Wheel Configuration</h2><br>
        <label>Number Of Sections</label><input id="ticketCount" type="number" min="2" max="60" value="${SETTINGS.ticket_count}">
        <label>Sales Duration (minutes)</label><input id="salesDuration" type="number" min="1" value="${SETTINGS.sales_duration || 120}">
        <label>Spin Duration (seconds)</label><input id="duration" type="number" min="5" value="${SETTINGS.duration_seconds}">
        <label>Number Of Winners</label><input id="winnerCount" type="number" min="1" max="60" value="${wc}" onchange="reloadPrizeInputs()">
        <label>Ticket Price (ETB)</label><input id="ticketPrice" type="number" min="0" value="${SETTINGS.ticket_price}">
        <br><hr style="border-color:#334155;margin:20px 0"><br>
        <h3 style="color:#fbbf24">🏆 Prize % per place</h3>
        <div id="prizeList">${inputs}</div>
        <br><hr style="border-color:#334155;margin:20px 0"><br>
        <h3 style="color:#fbbf24">🎁 Referral Rewards</h3>
        <label>Referrals For Free Ticket</label><input id="referralGoal" type="number" min="1" value="${SETTINGS.referral_goal || 8}">
        <label>Free Tickets Per Goal</label><input id="referralReward" type="number" min="1" value="${SETTINGS.referral_reward || 1}">
        <button type="button" class="main-button" onclick="saveWheelSettings()">Save Wheel Settings</button>
    </div>
    ${passwordHtml}
    `;
    translateUI();
}
function reloadPrizeInputs() { const wc = Math.max(1, Math.min(60, Number(document.getElementById('winnerCount').value) || 1)); let h = ''; for (let i = 0; i < wc; i++) { const d = i === 0 ? 50 : i === 1 ? 30 : i === 2 ? 10 : 5; h += '<label>Winner #' + (i + 1) + ' — %</label><input class="pct-input" type="number" min="0" max="100" value="' + d + '">'; } document.getElementById('prizeList').innerHTML = h; }
async function saveWheelSettings() {
    const ticketCount = Number(document.getElementById('ticketCount').value); const salesDuration = Number(document.getElementById('salesDuration').value); const duration = Number(document.getElementById('duration').value); const winners = Number(document.getElementById('winnerCount').value); const price = Number(document.getElementById('ticketPrice').value); const referralGoal = Number(document.getElementById('referralGoal').value); const referralReward = Number(document.getElementById('referralReward').value); const prizePercents = Array.from(document.querySelectorAll('.pct-input')).map(i => Number(i.value) || 0);
    try { if (ticketCount !== SETTINGS.ticket_count) await api('/admin/tickets/count', { method: 'POST', body: { count: ticketCount } }); await api('/admin/settings', { method: 'POST', body: { duration, winners, ticketPrice: price, referralGoal, referralReward, prizePercents, usePercentPrizes: true, salesDuration } }); await refreshState(); toast('✅ Saved.'); settingsPage(); } catch (e) { toast('❌ ' + e.message, true); }
}
function renderNBSettings(s) {
    if (!s) { document.getElementById('settingsContent').innerHTML = '<div class="card"><p class="muted">Not available</p></div>'; return; }
    const wc = s.winner_count || 1; const pcts = s.prize_percents || []; const roundMin = Number(s.round_duration_minutes || s.duration_minutes || 120); let inputs = '';
    for (let i = 0; i < wc; i++) { const v = pcts[i] !== undefined ? pcts[i] : (i === 0 ? 50 : i === 1 ? 30 : 10); inputs += '<label>Winner #' + (i + 1) + ' — % of revenue</label><input class="nb-pct-input" type="number" min="0" max="100" value="' + v + '">'; }

    const isMainAdmin = ME.role === 'main_admin' || ME.role === 'admin';
    const passwordHtml = isMainAdmin ? `
        <div class="card" style="border-color:#dc2626; margin-top:20px;">
            <h2 style="color:#dc2626">🔐 Change Admin Password</h2>
            <label>New Password</label>
            <input id="newAdminPwNb" type="password">
            <label>Secret Reset Code</label>
            <input id="resetCodeNb" type="password">
            <button type="button" class="main-button" style="background:#dc2626;color:white" onclick="changeAdminPassword('Nb')">🔐 Change Password</button>
        </div>` : '';

    document.getElementById('settingsContent').innerHTML = `
    <div class="card">
        <h2>🎰 NB Configuration</h2><br>
        <label>Total Numbers</label><input id="nbTotal" type="number" min="10" max="200" value="${s.total_numbers}">
        <label>Drawn per Round</label><input id="nbDrawn" type="number" min="1" max="50" value="${s.drawn_count}">
        <label>Tickets per Purchase</label><input id="nbTpp" type="number" min="1" max="20" value="${s.tickets_per_purchase}">
        <label>Price per Purchase</label><input id="nbPrice" type="number" min="0" value="${s.price_per_purchase}">
        <label>Draw Speed (seconds)</label><input id="nbDelay" type="number" min="1" max="30" value="${s.draw_delay_seconds}">
        <label>Round Duration (minutes)</label><input id="nbDuration" type="number" min="1" max="1440" value="${roundMin}">
        <label>Number of Winners</label><input id="nbWinners" type="number" min="1" max="20" value="${wc}" onchange="nbSettingsReloadPrizes()">
        <br><hr style="border-color:#334155;margin:16px 0"><br>
        <h3 style="color:#fbbf24">🏆 Prize % per place</h3>
        <div id="nbPrizeList">${inputs}</div>
        <button type="button" class="main-button" onclick="saveNBSettings()">Save NB Settings</button>
    </div>
    ${passwordHtml}
    `;
    translateUI();
}
function nbSettingsReloadPrizes() { const c = Math.max(1, Math.min(20, Number(document.getElementById('nbWinners').value) || 1)); let h = ''; for (let i = 0; i < c; i++) { const d = i === 0 ? 50 : i === 1 ? 30 : i === 2 ? 10 : 5; h += '<label>Winner #' + (i + 1) + ' — %</label><input class="nb-pct-input" type="number" min="0" max="100" value="' + d + '">'; } document.getElementById('nbPrizeList').innerHTML = h; }
async function saveNBSettings() {
    const total_numbers = Number(document.getElementById('nbTotal').value); const drawn_count = Number(document.getElementById('nbDrawn').value); const tickets_per_purchase = Number(document.getElementById('nbTpp').value); const price_per_purchase = Number(document.getElementById('nbPrice').value); const draw_delay_seconds = Number(document.getElementById('nbDelay').value); const round_duration_minutes = Number(document.getElementById('nbDuration').value); const winner_count = Number(document.getElementById('nbWinners').value); const prize_percents = Array.from(document.querySelectorAll('.nb-pct-input')).map(i => Number(i.value) || 0);
    if (!round_duration_minutes || round_duration_minutes < 1) { toast('Duration must be ≥ 1 minute', true); return; }
    try { await api('/admin/nb/settings', { method: 'POST', body: { total_numbers, drawn_count, tickets_per_purchase, price_per_purchase, draw_delay_seconds, round_duration_minutes, duration_minutes: round_duration_minutes, winner_count, prize_percents, use_percent_prizes: true }}); toast('✅ Saved'); try { nbState = await api('/nb/state'); } catch (e) {} await settingsPage(); } catch (e) { toast('❌ ' + e.message, true); }
}

async function changeAdminPassword(suffix = '') {
    const pwEl = document.getElementById('newAdminPw' + suffix); const codeEl = document.getElementById('resetCode' + suffix);
    if (!pwEl || !codeEl) return;
    const pw = pwEl.value.trim(), code = codeEl.value.trim();
    if (!pw || pw.length < 4) { toast('Min 4 characters', true); return; } if (!code) { toast('Enter code', true); return; }
    if (!(await confirmToast('Change admin password?', { title: 'Change Password', okText: 'Change' }))) return;
    try { await api('/admin/change-password', { method: 'POST', body: { newPassword: pw, code } }); toast('✅ Changed!'); pwEl.value = ''; codeEl.value = ''; } catch (e) { toast('❌ ' + e.message, true); }
}

boot();
</script>
</body>
</html>
