<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Wheel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0f172a; color: white; }
button, input, select { font-family: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.banner-img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; margin-bottom: 20px; display: block; background: #1e293b; box-shadow: 0 8px 30px rgba(0,0,0,0.4); border: 2px solid #334155; }
.login-banner-wrap { position: relative; margin-bottom: 20px; border-radius: 15px; overflow: hidden; border: 2px solid #fbbf24; box-shadow: 0 0 30px rgba(251,191,36,0.3); }
.login-animated-header { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; background: radial-gradient(circle at center, #1e3a5f 0%, #0f172a 100%); align-items: center; justify-items: center; }
.login-page { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background: radial-gradient(circle, #1e3a5f, #0f172a); }
.login-card { width: 430px; max-width: 100%; padding: 35px; background: #111827; border: 1px solid #334155; border-radius: 20px; }
.logo { text-align: center; font-size: 30px; font-weight: bold; margin-bottom: 10px; }
.logo span, .header-logo span { color: #fbbf24; }
.login-description { text-align: center; color: #94a3b8; margin-bottom: 25px; }
input, select { width: 100%; padding: 13px; margin: 7px 0 12px; border: 1px solid #475569; border-radius: 8px; background: #0b1220; color: white; outline: none; font-size: 14px; }
input:focus, select:focus { border-color: #fbbf24; }
.hint { font-size: 12px; color: #64748b; margin: -6px 0 10px; }
.main-button { width: 100%; padding: 13px; border: none; border-radius: 8px; background: #fbbf24; color: #111827; font-weight: bold; margin-top: 8px; }
.main-button:disabled { opacity: .5; cursor: not-allowed; }
.login-footer { text-align: center; color: #94a3b8; margin-top: 18px; }
.link-button { border: none; background: none; color: #fbbf24; font-weight: bold; }
.header { height: 70px; padding: 0 25px; display: flex; justify-content: space-between; align-items: center; background: #111827; border-bottom: 1px solid #334155; }
.header-logo { font-size: 25px; font-weight: bold; }
.header-user { display: flex; align-items: center; gap: 15px; }
.logout { padding: 9px 14px; border: none; border-radius: 7px; background: #991b1b; color: white; }
.layout { min-height: calc(100vh - 70px); display: grid; grid-template-columns: 230px 1fr; }
.sidebar { padding: 20px; background: #111827; border-right: 1px solid #334155; display: flex; flex-direction: column; }
.nav { width: 100%; padding: 13px; margin-bottom: 8px; border: none; border-radius: 8px; background: transparent; color: #94a3b8; text-align: left; }
.nav:hover { background: #1e293b; color: white; }
.nav.active { background: #334155; color: #fbbf24; }
.main { width: 100%; max-width: 1400px; padding: 25px; }
.card { padding: 20px; margin-bottom: 20px; background: #111827; border: 1px solid #334155; border-radius: 15px; }
.title { margin-bottom: 20px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
.stat { padding: 20px; background: #172033; border: 1px solid #334155; border-radius: 12px; }
.stat small { color: #94a3b8; }
.stat h2 { margin-top: 10px; color: #fbbf24; }
.muted { color: #94a3b8; }
.gold { color: #fbbf24; }
.toast { position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 16px 24px; border-radius: 10px; background: #166534; color: white; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,.4); transform: translateY(-20px); opacity: 0; transition: all .35s ease; max-width: 380px; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: #991b1b; }
.action-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
.action-btn { padding: 12px 20px; border: 1px solid #475569; border-radius: 8px; background: #fbbf24; color: #111827; font-weight: bold; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.action-btn.green { background: #22c55e; color: white; border-color: #22c55e; }
.action-btn.red { background: #dc2626; color: white; border-color: #dc2626; }
.action-btn.blue { background: #0ea5e9; color: white; border-color: #0ea5e9; }
.action-btn.purple { background: #a855f7; color: white; border-color: #a855f7; }
.ticket-grid, .ticket-selector { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; margin-top: 10px; }
.ticket-select { padding: 15px 5px; border: 1px solid #475569; border-radius: 8px; background: #172033; color: white; }
.ticket-select.selected { background: #fbbf24; color: #111827; }
.ticket-select.sold { background: #7f1d1d; color: #fecaca; }
.ticket-select.mine { background: #166534; color: #86efac; border-color: #4ade80; }
.ticket { padding: 18px; border-radius: 10px; background: #172033; border: 1px solid #475569; }
.ticket.sold { background: #3f1515; border-color: #991b1b; }
.ticket.free { background: #14532d; border-color: #4ade80; }
.ticket-number { font-size: 25px; font-weight: bold; color: #fbbf24; margin-bottom: 10px; }
.ticket-code { font-family: monospace; font-size: 11px; color: #0ea5e9; margin-bottom: 6px; }
.available { color: #4ade80; }
.sold-text { color: #f87171; }
.free-badge { color: #4ade80; font-weight: bold; font-size: 12px; }
.checkbox-row { display: flex; align-items: center; gap: 10px; padding: 12px; background: #0b1220; border-radius: 8px; border: 1px solid #4ade80; margin-bottom: 12px; }
.checkbox-row input { width: auto; margin: 0; }
.checkbox-row label { color: #86efac; font-weight: bold; margin: 0; display: inline; }
.nb-cell { display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: clamp(10px, 1.5vw, 22px); border-radius: 8px; background: #172033; border: 2px solid #334155; color: #94a3b8; user-select: none; cursor: pointer; min-height: 0; min-width: 0; }
.nb-cell:hover { border-color: #fbbf24; }
.nb-cell.mine { border-color: #fbbf24; color: #fbbf24; background: #1a1308; }
.nb-cell.mine-picked { background: #fbbf24; color: #111827; border-color: #fbbf24; }
.nb-cell.drawn-win { background: #16a34a; border-color: #22c55e; color: #fff; }
.nb-cell.drawn-lose { background: #991b1b; border-color: #dc2626; color: #fecaca; }
.nb-cell.nb-pop { animation: nbPopGreen 1.1s ease-out; z-index: 5; }
@keyframes nbPopGreen {
    0%   { transform: scale(1.35); background: #4ade80; box-shadow: 0 0 40px rgba(74,222,128,1); }
    40%  { transform: scale(1.15); background: #22c55e; box-shadow: 0 0 25px rgba(34,197,94,0.8); }
    100% { transform: scale(1);    background: #16a34a; box-shadow: 0 0 0 rgba(0,0,0,0); }
}
.nb-pick-chip { display: inline-block; padding: 6px 12px; background: #fbbf24; color: #111827; border-radius: 20px; font-weight: bold; font-size: 13px; }
.nb-pick-info { padding: 12px; background: #0b1220; border: 1px dashed #fbbf24; border-radius: 10px; margin: 12px 0; font-size: 14px; }
.nb-pick-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.game-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.game-tab { flex: 1; min-width: 140px; padding: 16px; border: 2px solid #334155; border-radius: 12px; background: #172033; color: #94a3b8; font-weight: bold; font-size: 15px; text-align: center; cursor: pointer; }
.game-tab.active { background: #fbbf24; border-color: #fbbf24; color: #111827; }
.nb-timer { text-align: center; font-size: 38px; font-weight: bold; color: #22c55e; font-family: monospace; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 2px solid #166534; margin-bottom: 12px; }
.nb-timer.drawing { color: #ef4444; border-color: #ef4444; }
.nb-timer.idle { color: #94a3b8; border-color: #334155; }
.nb-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.wheel-layout { display: grid; grid-template-columns: minmax(300px, 460px) 1fr; gap: 30px; align-items: center; }
.wheel-container { position: relative; width: 380px; max-width: 88vw; aspect-ratio: 1; margin: auto; }
.wheel { width: 100%; height: 100%; position: relative; overflow: hidden; border: 7px solid #fbbf24; border-radius: 50%; background: #334155; box-shadow: 0 0 40px rgba(0,0,0,.5); }
.wheel-labels { position: absolute; inset: 0; pointer-events: none; }
.wl { position: absolute; inset: 0; display: flex; justify-content: center; }
.wl span { margin-top: 14px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.pointer { position: absolute; z-index: 20; top: -2px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent; border-top: 38px solid red; }
.pointer.winner { border-top-color: #4ade80; }
.center { position: absolute; z-index: 30; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 78px; height: 78px; border-radius: 50%; background: #111827; border: 4px solid #fbbf24; display: flex; justify-content: center; align-items: center; font-size: 13px; font-weight: bold; text-align: center; }
.timer { text-align: center; font-size: 60px; font-weight: bold; color: #fbbf24; margin-bottom: 15px; font-family: monospace; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 2px solid #334155; }
.timer.sales { color: #22c55e; border-color: #166534; }
.timer.spinning { color: #ef4444; border-color: #ef4444; }
.status { text-align: center; color: #94a3b8; margin-bottom: 15px; }
.winners { padding: 20px; margin-top: 20px; border-radius: 12px; background: #14532d; border: 1px solid #4ade80; }
.winners h2 { color: #4ade80; margin-bottom: 12px; }
.winner { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.15); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 13px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
th { color: #94a3b8; }
.table-box { overflow-x: auto; }
.small-button { padding: 8px 12px; border: none; border-radius: 7px; background: #334155; color: white; margin: 2px; cursor: pointer; }
.gold-button { background: #fbbf24; color: #111827; }
.red-button { background: #991b1b; color: white; }
.green-button { background: #166534; color: white; }
.history { padding: 18px; margin-bottom: 12px; background: #172033; border: 1px solid #334155; border-radius: 10px; }
.history h3 { color: #fbbf24; margin-bottom: 8px; }
.status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
.status-badge.pending { background: #78350f; color: #fcd34d; }
.status-badge.approved { background: #166534; color: #86efac; }
.status-badge.rejected { background: #7f1d1d; color: #fecaca; }
.req-card { padding: 16px; border-radius: 12px; background: #172033; border: 1px solid #334155; margin-bottom: 12px; }
.req-card .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; flex-wrap: wrap; gap: 6px; }
.req-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.method-box { padding: 20px; border-radius: 12px; border: 2px dashed #fbbf24; background: #0b1220; margin: 12px 0; }
.method-box h3 { color: #fbbf24; margin-bottom: 8px; }
.method-box .acct { font-size: 22px; font-weight: bold; font-family: monospace; letter-spacing: 2px; color: #ffffff; margin: 6px 0; }
.method-box .name { color: #86efac; font-weight: bold; }
.telegram-banner { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: linear-gradient(135deg, #0088cc, #006699); border: 1px solid #4dd0e1; border-radius: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.telegram-banner .icon { font-size: 32px; }
.telegram-banner .text { flex: 1; min-width: 200px; }
.telegram-banner .text h3 { color: #fff; margin-bottom: 4px; font-size: 16px; }
.telegram-banner .text p { color: #e0f7fa; font-size: 13px; }
.telegram-banner .join-btn { padding: 10px 20px; background: #fff; color: #006699; border: none; border-radius: 8px; font-weight: bold; text-decoration: none; cursor: pointer; }
.receipt-modal { position: fixed; inset: 0; z-index: 99999; background: rgba(0,0,0,.85); display: flex; justify-content: center; align-items: center; padding: 20px; }
.receipt-box { background: white; color: #111; max-width: 480px; width: 100%; padding: 30px; border-radius: 12px; font-family: 'Courier New', monospace; max-height: 90vh; overflow-y: auto; }
.receipt-box h2 { text-align: center; margin-bottom: 16px; }
.receipt-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #ccc; font-size: 14px; gap: 8px; }
.receipt-footer { text-align: center; margin-top: 20px; font-size: 12px; color: #666; }
.receipt-buttons { display: flex; gap: 10px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
.receipt-buttons button { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
.rcpt-print { background: #16a34a; color: white; }
.rcpt-close { background: #64748b; color: white; }
.live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #4ade80; margin-right: 6px; animation: livePulse 1.2s infinite; }
@keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:.25} }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
.progress-bar { width: 100%; height: 14px; background: #0b1220; border-radius: 7px; overflow: hidden; margin: 10px 0; border: 1px solid #334155; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #f59e0b); }
.referral-card { padding: 22px; margin-bottom: 20px; border-radius: 15px; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #fbbf24; }
.referral-code-box { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
.referral-code { padding: 12px 20px; border-radius: 8px; background: #0b1220; border: 2px dashed #fbbf24; font-size: 22px; font-weight: bold; letter-spacing: 3px; color: #fbbf24; font-family: monospace; }
.copy-btn { padding: 12px 18px; border: none; border-radius: 8px; background: #fbbf24; color: #111827; font-weight: bold; cursor: pointer; }
.ref-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
.ref-badge { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: bold; }
.ref-badge.active { background: #166534; color: #86efac; }
.ref-badge.pending { background: #78350f; color: #fcd34d; }
.nb-hero { width: 100%; height: 180px; border-radius: 15px; margin-bottom: 20px; overflow: hidden; border: 2px solid #334155; background: linear-gradient(135deg,#0b1220,#1e293b); display: flex; align-items: center; justify-content: center; }

/* Wheel hero banner */
.wheel-hero-img { width: 100%; height: 220px; border-radius: 15px; overflow: hidden; margin-bottom: 20px; border: 2px solid #334155; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
.wheel-hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

.wheel-page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }

/* Numbers grid inline */
.nb-grid-inline {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    width: 100%;
    margin-top: 12px;
}

/* Horizontal winner cards */
.nb-overlay-winners { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.nb-win-title { font-size: 20px; color: #4ade80; margin-bottom: 6px; }
.nb-win-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-start; }
.nb-win-card { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: linear-gradient(135deg, #0b1220, #111827); border: 3px solid #06B6D4; box-shadow: 0 8px 24px rgba(0,0,0,0.5); min-width: 260px; flex: 1 1 260px; max-width: 380px; }
.nb-win-card.place-1 { border-color: #FFD700; box-shadow: 0 0 30px rgba(255,215,0,0.55); }
.nb-win-card.place-2 { border-color: #C0C0C0; box-shadow: 0 0 24px rgba(192,192,192,0.5); }
.nb-win-card.place-3 { border-color: #CD7F32; box-shadow: 0 0 24px rgba(205,127,50,0.5); }
.nb-win-card.place-4, .nb-win-card.place-5 { border-color: #3B82F6; box-shadow: 0 0 22px rgba(59,130,246,0.45); }
.nb-win-card .nwc-medal { font-size: 28px; }
.nb-win-card .nwc-place { font-size: 12px; color: #94a3b8; text-align: center; }
.nb-win-card .nwc-left { display: flex; flex-direction: column; align-items: center; }
.nb-win-card .nwc-body { flex: 1; }
.nb-win-card .nwc-name { font-weight: bold; color: #fff; font-size: 15px; }
.nb-win-card .nwc-meta { font-size: 11px; color: #94a3b8; font-family: monospace; margin-top: 2px; }
.nb-win-card .nwc-nums { font-size: 12px; color: #cbd5e1; font-family: monospace; margin-top: 4px; }
.nb-win-card .nwc-prize { color: #fbbf24; font-weight: bold; font-size: 16px; white-space: nowrap; }

/* Exit public view button */
#exitPublicBtn { display: none; position: fixed; top: 12px; right: 12px; z-index: 9999; padding: 10px 16px; background: #991b1b; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }

/* Full-screen public view for NB */
body.public-view .header,
body.public-view .sidebar,
body.public-view .nb-stats,
body.public-view .nb-timer,
body.public-view .nb-hero,
body.public-view .title,
body.public-view .card > div > p.muted { display: none !important; }
body.public-view .layout { grid-template-columns: 1fr !important; }
body.public-view .main { max-width: 100% !important; padding: 8px !important; height: 100vh; overflow: auto; }
body.public-view .card { border: none; background: transparent; padding: 0; margin: 0; }
body.public-view .nb-grid-inline { height: 78vh; gap: 8px; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(8, 1fr); }
body.public-view .nb-cell { font-size: clamp(16px, 2.4vw, 40px); border-radius: 12px; }
body.public-view #nbWinnersOverlay { margin-top: 12px; }
body.public-view #exitPublicBtn { display: inline-flex !important; }
body.public-view .nb-win-card { min-width: 320px; flex: 1 1 320px; max-width: 480px; }
body.public-view .nwc-name { font-size: 18px; }
body.public-view .nwc-prize { font-size: 20px; }

/* Full-screen public view for the wheel */
body.wheel-public .header,
body.wheel-public .sidebar,
body.wheel-public .title,
body.wheel-public .wheel-hero-img,
body.wheel-public .status { display: none !important; }
body.wheel-public .layout { grid-template-columns: 1fr !important; }
body.wheel-public .main { max-width: 100% !important; padding: 8px !important; height: 100vh; overflow: hidden; }
body.wheel-public .card { border: none; background: transparent; padding: 0; margin: 0; }
body.wheel-public .wheel-layout {
    grid-template-columns: 1fr;
    gap: 20px;
    justify-items: center;
    height: auto;
    min-height: 100vh;
    align-content: start;
    padding-top: 20px;
}
body.wheel-public .wheel-container {
    width: min(80vh, 90vw);
    max-width: 900px;
}
body.wheel-public .timer {
    font-size: 80px;
    padding: 20px 40px;
    margin: 0 auto 20px;
    width: fit-content;
    min-width: 300px;
}
body.wheel-public .action-buttons { justify-content: center; }
body.wheel-public #exitPublicBtn { display: inline-flex !important; }

@media(max-width:1000px) { .stats { grid-template-columns: repeat(2,1fr); } .wheel-layout { grid-template-columns: 1fr; } .nb-stats { grid-template-columns: repeat(2, 1fr); } }
@media(max-width:700px) { .layout { grid-template-columns: 1fr; } .sidebar { display: flex; overflow-x: auto; padding: 10px; } .nav { min-width: 130px; margin-right: 5px; } .main { padding: 12px; } .stats { grid-template-columns: 1fr; } .wheel-container { width: 320px; } .timer { font-size: 40px; } .hero-banner { height: 200px; } }
/* Big winners display for the wheel public view */
body.wheel-public #winnerArea {
    width: 100%;
    max-width: 1400px;
    margin: 20px auto 0;
    padding: 0 20px;
}

body.wheel-public .winners {
    background: linear-gradient(135deg, #14532d, #0f172a);
    border: 3px solid #4ade80;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 0 60px rgba(74,222,128,0.5);
    animation: winnerFlash 1.5s ease-in-out infinite;
}

@keyframes winnerFlash {
    0%, 100% { box-shadow: 0 0 40px rgba(74,222,128,0.45); }
    50%      { box-shadow: 0 0 80px rgba(74,222,128,0.95); }
}

body.wheel-public .winners h2 {
    font-size: 42px;
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 0 0 30px rgba(74,222,128,0.9);
}

body.wheel-public .winners .winner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 18px 22px;
    margin-bottom: 12px;
    background: #0b1220;
    border: 2px solid #4ade80;
    border-radius: 14px;
    font-size: 22px;
    font-weight: bold;
}

body.wheel-public .winners .winner .gold {
    font-size: 26px;
    color: #fbbf24;
    text-shadow: 0 0 15px rgba(251,191,36,0.9);
}
</style>
</head>
<body>
<div id="toast" class="toast hidden"></div>

function toast(msg, isError = false) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 4500);
}

async function api(path, options = {}) {
    let res;
    try {
        res = await fetch(API + path, {
            method: options.method || 'GET',
            headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) },
            body: options.body ? JSON.stringify(options.body) : undefined
        });
    } catch (err) { throw new Error('Network error.'); }
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
}

async function boot() {
    try {
        const cfg = await api('/config');
        CONFIG = cfg;
        sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    } catch (e) { console.error('Realtime init failed', e); }
    const urlRef = new URLSearchParams(window.location.search).get('ref');
    if (urlRef) {
        const input = document.getElementById('regReferral');
        if (input) input.value = urlRef.toUpperCase();
        setTimeout(() => showRegister(), 100);
    }
    if (TOKEN) { try { await enterApp(); return; } catch (e) { TOKEN = null; localStorage.removeItem('lw_token'); } }
    showLoginPage();
}
function showLoginPage() {
    const lp = document.getElementById('loginPage');
    const ap = document.getElementById('app');
    if (lp) lp.classList.remove('hidden');
    if (ap) ap.classList.add('hidden');
}
function showRegister() {
    const lf = document.getElementById('loginForm');
    const rg = document.getElementById('register');
    if (lf) lf.classList.add('hidden');
    if (rg) rg.classList.remove('hidden');
}
function showLogin() {
    const lf = document.getElementById('loginForm');
    const rg = document.getElementById('register');
    if (lf) lf.classList.remove('hidden');
    if (rg) rg.classList.add('hidden');
}
async function register() {
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value.trim();
    const referralCode = document.getElementById('regReferral').value.trim().toUpperCase();
    if (!name || !phone || !password) { alert('Fill all fields.'); return; }
    try {
        const res = await api('/auth/register', { method: 'POST', body: { name, phone, password, referralCode } });
        alert('✅ Account created!\n\nReferral code: ' + res.referral_code);
        showLogin();
    } catch (e) { alert('❌ ' + e.message); }
}
async function loginUser() {
    const phone = document.getElementById('loginPhone').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    if (!phone || !password) { alert('Enter phone and password.'); return; }
    try {
        const data = await api('/auth/login', { method: 'POST', body: { phone, password } });
        TOKEN = data.token;
        localStorage.setItem('lw_token', TOKEN);
        await enterApp();
    } catch (e) { alert('❌ ' + e.message); }
}
async function enterApp() {
    await refreshState();
    const lp = document.getElementById('loginPage');
    const ap = document.getElementById('app');
    if (lp) lp.classList.add('hidden');
    if (ap) ap.classList.remove('hidden');
    const hn = document.getElementById('headerName');
    if (hn) hn.textContent = ME.role === 'admin' ? 'Admin' : ME.name;
    renderSidebar();
    subscribeRealtime();
    startAutoPoll();
    openPage('dashboard');
}
async function refreshState() {
    const data = await api('/state');
    SETTINGS = data.settings; TICKETS = data.tickets; ME = data.me;
}
function subscribeRealtime() {
    if (!sb || subscribed) return;
    subscribed = true;
    sb.channel('lucky-wheel-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, onLiveUpdate)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' },  onLiveUpdate)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rounds' },   onLiveUpdate)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'users' },    onLiveUpdate)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'deposits' }, onLiveUpdate)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'withdrawals' }, onLiveUpdate)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'nb_settings' }, onLiveUpdate)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'nb_tickets' },  onLiveUpdate)
      .subscribe();
}
let liveBusy = false;
async function onLiveUpdate() {
    if (liveBusy) return; liveBusy = true;
    try { await refreshState(); await renderPage(); } catch (e) { console.warn(e); }
    finally { liveBusy = false; }
}
function startAutoPoll() {
    if (autoPollId) clearInterval(autoPollId);
    autoPollId = setInterval(async () => { try { await api('/admin/auto-check', { method: 'POST' }); } catch (e) {} }, 5000);
}
function openPage(page) {
    PAGE = page;
    document.querySelectorAll('.nav').forEach(btn => btn.classList.toggle('active', btn.dataset.page === page));
    renderPage();
}
async function renderPage() {
    if (!ME) return;
    stopLivePolls();
    if (PAGE === 'dashboard')  return dashboard();
    if (PAGE === 'wheel')      return wheelPage();
    if (PAGE === 'nb')         return nbPage();
    if (PAGE === 'buy')        return buyPage();
    if (PAGE === 'my-tickets') return myTicketsPage();
    if (PAGE === 'verify')     return verifyPage();
    if (PAGE === 'deposit')    return depositPage();
    if (PAGE === 'withdraw')   return withdrawPage();
    if (PAGE === 'referrals')  return referralsPage();
    if (PAGE === 'users')      return usersPage();
    if (PAGE === 'tickets')    return ticketsPage();
    if (PAGE === 'requests')   return requestsPage();
    if (PAGE === 'history')    return historyPage();
    if (PAGE === 'settings')   return settingsPage();
}
function stopLivePolls() { if (nbPollId) { clearInterval(nbPollId); nbPollId = null; } if (nbSettleId) { clearInterval(nbSettleId); nbSettleId = null; } }

function logout() {
    if (!confirm('Logout?')) return;
    try { localStorage.removeItem('lw_token'); } catch (e) {}
    TOKEN = null; ME = null;
    if (sb) { try { sb.removeAllChannels(); } catch (e) {} }
    subscribed = false;
    if (autoPollId) { clearInterval(autoPollId); autoPollId = null; }
    if (countdownId) { clearInterval(countdownId); countdownId = null; }
    try { stopLivePolls(); } catch (e) {}
    try { closeReceipt(); } catch (e) {}
    document.body.classList.remove('public-view', 'wheel-public');
    const lp = document.getElementById('loginPage');
    const ap = document.getElementById('app');
    if (lp) lp.classList.remove('hidden');
    if (ap) ap.classList.add('hidden');
    const p = document.getElementById('loginPhone'); if (p) p.value = '';
    const pw = document.getElementById('loginPassword'); if (pw) pw.value = '';
}

function money(v) { return Number(v || 0).toLocaleString() + ' ETB'; }
function formatTime(s) { s = Math.max(0, Number(s)); const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); const sec = Math.floor(s % 60); if (h > 0) return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0'); }
function formatDate(d) { try { return new Date(d).toLocaleString(); } catch { return '—'; } }
function escapeHTML(v) { return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }

function enterPublicView() { document.body.classList.add('public-view'); }
function exitPublicView() { document.body.classList.remove('public-view', 'wheel-public'); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') exitPublicView(); });
/* ================= RECEIPT ================= */
function showReceipt(data) {
    const el = document.getElementById('receiptArea');
    if (!el) return;
    let rows = '';
    if (data.tickets && data.tickets.length) {
        rows = data.tickets.map(t => {
            const num = typeof t === 'object' ? t.number : t;
            const code = typeof t === 'object' && t.printer_code ? t.printer_code : '—';
            const qr = code && code !== '—' ? 'https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=' + encodeURIComponent(code) : '';
            return '<div class="receipt-row"><span><b>#' + num + '</b> · <code>' + code + '</code></span>' +
                   (qr ? '<img src="' + qr + '" style="width:70px;height:70px;border:1px solid #ccc;padding:2px">' : '') + '</div>';
        }).join('');
    }
    el.innerHTML = `
        <div class="receipt-modal" onclick="if(event.target===this)closeReceipt()">
            <div class="receipt-box">
                <h2>🎡 LUCKY WHEEL</h2>
                <p style="text-align:center;font-size:12px;margin-bottom:16px">Official Ticket Receipt</p>
                <div class="receipt-row"><b>Game:</b> <span>${escapeHTML(data.game)}</span></div>
                <div class="receipt-row"><b>Round:</b> <span>#${data.round}</span></div>
                <div class="receipt-row"><b>Ref:</b> <span>${escapeHTML(data.ref)}</span></div>
                <div class="receipt-row"><b>Date:</b> <span>${new Date(data.date).toLocaleString()}</span></div>
                <div class="receipt-row"><b>Owner:</b> <span>${escapeHTML(data.owner.name)}</span></div>
                <div class="receipt-row"><b>Phone:</b> <span>${escapeHTML(data.owner.phone)}</span></div>
                ${data.owner.public_code ? '<div class="receipt-row"><b>User ID:</b> <span>' + escapeHTML(data.owner.public_code) + '</span></div>' : ''}
                <div class="receipt-row"><b>Price:</b> <span>${money(data.price)}</span></div>
                <div style="margin-top:14px"><b>TICKETS:</b></div>
                ${rows || '<p style="text-align:center">No tickets</p>'}
                <div class="receipt-footer">Keep safe. Scan QR to verify.</div>
                <div class="receipt-buttons">
                    <button class="rcpt-print" onclick="window.print()">🖨️ Print / Save PDF</button>
                    <button class="rcpt-close" onclick="closeReceipt()">✕ Close</button>
                </div>
            </div>
        </div>`;
}
function closeReceipt() { const el = document.getElementById('receiptArea'); if (el) el.innerHTML = ''; }

function verifySwitchGame(g) { verifyGame = g; verifyPage(); }
async function doVerifyQuick() {
    const raw = document.getElementById('verifyQuick').value.trim();
    const out = document.getElementById('verifyResult');
    if (!raw) { alert('Enter value'); return; }
    out.innerHTML = '<div class="card"><p>⏳ Checking...</p></div>';
    try {
        const isPrinter = /^[A-Z]{2}\d{5}/i.test(raw);
        const body = isPrinter ? { printerCode: raw.toUpperCase() } : { game: verifyGame, ticketNumber: raw };
        const res = await api('/verify-ticket', { method: 'POST', body });
        out.innerHTML = renderVerifyResult(res);
    } catch (e) { out.innerHTML = '<div class="card" style="border-color:#991b1b"><h2 style="color:#f87171">❌ ' + escapeHTML(e.message) + '</h2></div>'; }
}
let _qrScanner = null;
async function startScanner() {
    const container = document.getElementById('qr-reader');
    container.innerHTML = 'Loading...';
    if (!window.Html5Qrcode) {
        await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://unpkg.com/html5-qrcode'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    }
    container.innerHTML = '<div id="qr-reader-inner" style="width:100%;max-width:400px"></div>';
    try {
        _qrScanner = new window.Html5Qrcode('qr-reader-inner');
        await _qrScanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, async (decoded) => {
            try { await _qrScanner.stop(); } catch (e) {}
            const out = document.getElementById('verifyResult');
            out.innerHTML = '<div class="card"><p>⏳ Checking...</p></div>';
            try { const res = await api('/verify-ticket', { method: 'POST', body: { printerCode: decoded.trim().toUpperCase() } }); out.innerHTML = renderVerifyResult(res); }
            catch (e) { out.innerHTML = '<div class="card" style="border-color:#991b1b"><h2 style="color:#f87171">❌ ' + escapeHTML(e.message) + '</h2></div>'; }
        }, (e) => {});
    } catch (e) { container.innerHTML = '<p style="color:#f87171">❌ Camera unavailable: ' + escapeHTML(e.message) + '</p>'; }
}
function renderVerifyResult(res) {
    const isWinner = res.is_winner === true;

        : '<span style="color:#f87171;font-weight:bold">❌ Not a winner</span>';
    return `<div class="card" style="border-color:${isWinner ? '#4ade80' : '#0ea5e9'}">
        <h2 style="color:${isWinner ? '#4ade80' : '#0ea5e9'}">✅ Ticket Verified</h2>

            <div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid #334155"><b>Status:</b> ${badge}</div>

}

function buyRenderWheel() {
    const open = SETTINGS.sales_state === 'open';
    const seen = new Set();
    const list = [];
    for (const t of TICKETS) { if (seen.has(t.ticket_number)) continue; seen.add(t.ticket_number); list.push(t); }
    list.sort((a, b) => a.ticket_number - b.ticket_number);
    let grid = '';
    for (const t of list) {
        const owners = TICKETS.filter(x => x.ticket_number === t.ticket_number && x.user_id);
        const mine = owners.some(x => String(x.user_id) === String(ME.id));
        let cls = 'ticket-select';
        if (mine) cls += ' mine';
        else if (owners.length) cls += ' sold';
        let label = 'AVAILABLE';
        if (mine) label = 'YOURS (' + owners.length + ')';
        else if (owners.length) label = 'SOLD (' + owners.length + ')';
        grid += '<button type="button" class="' + cls + '" onclick="selectBuy(' + t.ticket_number + ', this)">#' + t.ticket_number + '<br><small>' + label + '</small></button>';
    }
    document.getElementById('buyContent').innerHTML = `
        ${!open ? '<div class="card" style="background:#7f1d1d"><p><b>⚠️ Sales CLOSED.</b></p></div>' : ''}

            <div class="checkbox-row"><input type="checkbox" id="buyUseFree" ${(ME.free_tickets||0)===0?'disabled':''} onchange="updateBuyTotals()"><label>🎁 Use FREE ticket (${ME.free_tickets||0})</label></div>
            <p><b>Selected:</b> <span id="buyCount">0</span></p>
            <p><b>Total:</b> <span class="gold" id="buyCost">${money(0)}</span></p><br>

        </div>`;

function selectBuy(n, el) {
    const free = document.getElementById('buyUseFree').checked;
    if (free) { document.querySelectorAll('.ticket-select.selected').forEach(e => e.classList.remove('selected')); buySelected = [n]; el.classList.add('selected'); }
    else { if (buySelected.includes(n)) { buySelected = buySelected.filter(x => x !== n); el.classList.remove('selected'); } else { buySelected.push(n); el.classList.add('selected'); } }
    updateBuyTotals();
}
function updateBuyTotals() {
    const free = document.getElementById('buyUseFree').checked;
    const cnt = buySelected.length;
    const cost = free ? 0 : cnt * Number(SETTINGS.ticket_price);
    const c1 = document.getElementById('buyCount'); if (c1) c1.textContent = cnt;
    const c2 = document.getElementById('buyCost'); if (c2) c2.textContent = money(cost);
}
async function buySelectedTickets() {
    if (!buySelected.length) { alert('Select at least one'); return; }
    const free = document.getElementById('buyUseFree').checked;
    if (free && buySelected.length > 1) { alert('Free ticket = 1 only'); return; }
    const cost = free ? 0 : buySelected.length * Number(SETTINGS.ticket_price);
    if (!free && Number(ME.balance) < cost) { alert('Insufficient balance'); return; }
    if (!confirm('Buy ' + buySelected.length + ' for ' + money(cost) + '?')) return;
    try {
        await api('/user/tickets/buy', { method: 'POST', body: { numbers: buySelected, useFreeTicket: free } });
        await refreshState();
        buyPage();
    } catch (e) { alert('❌ ' + e.message); }
}

    let grid = '';

    }

function nbBuyClick(num, cell, tpp) {

function nbStatusText(s) {
    if (s.round_state === 'drawing') return '🎬 DRAWING';
    if (s.round_state === 'finished') return '✅ FINISHED';
    if (s.sales_state === 'open') return '🟢 OPEN';
    if (s.sales_state === 'closed') return '🔴 CLOSED';
    return '⚪ IDLE';
}
function nbDrawnSoFar(s) {
    if (!s.winning_numbers || !s.winning_numbers.length) return 0;
    if (s.round_state === 'finished') return s.winning_numbers.length;
    if (s.round_state !== 'drawing') return 0;
    const start = _drawStartClient ? Math.max(new Date(s.drawing_started_at).getTime(), _drawStartClient - 500) : new Date(s.drawing_started_at).getTime();
    const elapsed = (Date.now() - start) / 1000;
    return Math.min(s.winning_numbers.length, Math.max(0, Math.floor(elapsed / Math.max(1, s.draw_delay_seconds)) + 1));
}
function nbStartPolls(s) {
    if (nbPollId) clearInterval(nbPollId);
    if (nbSettleId) clearInterval(nbSettleId);
    if (s.round_state === 'drawing' && s.drawing_started_at) {
        const key = s.round_number + ':' + s.drawing_started_at;
        if (_drawRoundKey !== key) { _drawRoundKey = key; _drawStartClient = Date.now(); _lastShown = -1; }
    } else { _drawStartClient = null; _drawRoundKey = null; _lastShown = -1; }
    nbTickTimer();
    nbPollId = setInterval(() => { nbTickTimer(); nbRevealTick(); }, 200);
    nbSettleId = setInterval(async () => {
        if (nbState && nbState.settings.round_state === 'drawing') {
            try { await api('/nb/settle', { method: 'POST' }); const s2 = await api('/nb/state'); nbState = s2; } catch (e) {}
        }
    }, 3000);
}
function nbRevealTick() {
    if (!nbState) return;
    const s = nbState.settings;
    if (s.round_state !== 'drawing' && s.round_state !== 'finished') { _lastShown = -1; return; }
    const key = s.round_number + ':' + s.drawing_started_at;
    if (_drawRoundKey !== key) { _drawRoundKey = key; _drawStartClient = Date.now(); _lastShown = -1; }
    const shown = s.round_state === 'finished' ? (s.winning_numbers || []).length : nbDrawnSoFar(s);
    if (shown !== _lastShown) {
        _lastShown = shown;
        const grid = document.getElementById('nbGrid');
        if (grid) {
            const drawnSet = new Set((s.winning_numbers || []).slice(0, shown));
            const mineSet = new Set((nbState.my_tickets||[]).map(t => t.number));
            const justDrawn = s.winning_numbers[shown - 1];
            let html = '';
            for (let i = 1; i <= s.total_numbers; i++) {
                let cls = 'nb-cell';
                const isDrawn = drawnSet.has(i);
                if (s.round_state === 'drawing' || s.round_state === 'finished') cls += isDrawn ? ' drawn-win' : ' drawn-lose';
                else if (mineSet.has(i)) cls += ' mine';
                if (isDrawn && i === justDrawn && s.round_state === 'drawing') cls += ' nb-pop';
                html += '<div class="' + cls + '" data-num="' + i + '">' + i + '</div>';
            }
            grid.innerHTML = html;
        }
        const drawnEl = document.getElementById('nbDrawnH');
        if (drawnEl) drawnEl.textContent = shown + '/' + s.drawn_count;
        if (s.round_state === 'finished') renderNbWinnersOverlay(s);
    }
}
function nbTickTimer() {
    if (!nbState) return;
    const s = nbState.settings;
    const el = document.getElementById('nbTimer'); if (!el) return;
    if (s.round_state === 'drawing' && s.drawing_started_at) {
        const elapsed = (Date.now() - new Date(s.drawing_started_at).getTime()) / 1000;
        const secs = Math.max(0, (s.drawn_count * s.draw_delay_seconds) - elapsed);
        el.textContent = 'DRAW ' + nbDrawnSoFar(s) + '/' + s.drawn_count + ' · ' + formatTime(Math.ceil(secs));
    } else if (s.sales_state === 'open' && s.sales_started_at) {
        const elapsed = (Date.now() - new Date(s.sales_started_at).getTime()) / 1000;
        el.textContent = 'SALES ' + formatTime(Math.ceil(Math.max(0, s.round_duration_minutes * 60 - elapsed)));
    } else el.textContent = '--:--';
}

function enterPublicViewWheel() {
    document.body.classList.add('public-view', 'wheel-public');
    setTimeout(() => {
        const board = document.querySelector('.wheel-container');
        if (board) board.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);

function buildWheel() {
    const wheel = document.getElementById('wheel');
    const labels = document.getElementById('wheelLabels');
    if (!wheel || !labels) return;
    const seen = new Set();
    const sold = [];
    for (const t of TICKETS) {
        if (t.user_id === null) continue;
        if (seen.has(t.ticket_number)) continue;
        seen.add(t.ticket_number);
        sold.push(t);
    }
    const n = sold.length;
    if (n === 0) { wheel.style.background = '#334155'; labels.innerHTML = '<div style="position:absolute;inset:0;display:flex;justify-content:center;align-items:center;color:#94a3b8;font-size:16px">No tickets sold</div>'; return; }
    const angle = 360 / n;
    const winners = SETTINGS.round_state === 'finished' ? (SETTINGS.winner_numbers || []) : [];
    const stops = [];
    for (let i = 0; i < n; i++) {
        const t = sold[i];
        const s = i * angle, e = (i + 1) * angle;
        let c;
        if (winners.includes(t.ticket_number)) c = '#fbbf24';
        else if (i % 2) c = 'hsl(' + ((t.ticket_number * 37) % 360) + ', 62%, 38%)';
        else c = 'hsl(' + ((t.ticket_number * 37) % 360) + ', 55%, 27%)';
        stops.push(c + ' ' + s + 'deg ' + e + 'deg');
    }
    wheel.style.background = 'conic-gradient(from 0deg,' + stops.join(',') + ')';
    const fs = Math.max(9, Math.min(22, 250 / n));
    let html = '';
    for (let i = 0; i < n; i++) {
        const t = sold[i];
        const rot = i * angle + angle / 2;
        const isW = winners.includes(t.ticket_number);
        html += '<div class="wl" style="transform:rotate(' + rot + 'deg)"><span style="font-size:' + fs + 'px;color:' + (isW?'#111827':'#fff') + '">#' + t.ticket_number + '</span></div>';
    }
    labels.innerHTML = html;
}
function applyWheelState() {
    const wheel = document.getElementById('wheel');
    if (!wheel) return;
    const s = SETTINGS;
    const target = Number(s.target_rotation || 0);
    const timerEl = document.getElementById('timer');
    if (!timerEl) return;

    if (s.round_state === 'spinning') {
        const startedAt = new Date(s.spin_started_at).getTime();
        const duration = Number(s.duration_seconds) || 30;
        const spinKey = s.round_number + ':' + s.spin_started_at;
        if (wheel._spinKey !== spinKey) {
            wheel._spinKey = spinKey;
            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            wheel.getBoundingClientRect();
            setTimeout(() => {
                wheel.style.transition = 'transform ' + duration + 's cubic-bezier(.17,.67,.35,1)';
                wheel.style.transform = 'rotate(' + (360 * 6 + target) + 'deg)';
            }, 20);
            const pointer = document.getElementById('topPointer');
            if (pointer) pointer.classList.remove('winner');
            const center = document.getElementById('wheelCenter');
            if (center) center.textContent = 'SPINNING';
        }
        timerEl.classList.remove('sales');
        timerEl.classList.add('spinning');
        startCountdown(startedAt, duration);
        return;
    }

    if (s.round_state === 'idle' && s.sales_state === 'open') {
        timerEl.classList.remove('spinning');
        timerEl.classList.add('sales');
        startSalesCountdown(new Date(s.sales_started_at).getTime(), s.sales_duration || 120);
        const center = document.getElementById('wheelCenter');
        if (center) center.textContent = 'READY';
        return;
    }

    if (s.round_state === 'idle' && s.sales_state !== 'open') {
        stopCountdown();
        wheel._spinKey = null;
        wheel.style.transition = 'none';
        wheel.style.transform = 'rotate(0deg)';
        const pointer = document.getElementById('topPointer');
        if (pointer) pointer.classList.remove('winner');
        const center = document.getElementById('wheelCenter');
        if (center) center.textContent = 'SPIN';
        const area = document.getElementById('winnerArea');
        if (area) area.innerHTML = '';
        timerEl.classList.remove('spinning', 'sales');
        timerEl.textContent = formatTime(s.duration_seconds);
        return;
    }

    if (s.round_state === 'finished') {
        stopCountdown();
        timerEl.classList.remove('spinning', 'sales');
        wheel._spinKey = null;
        wheel.style.transition = 'none';
        wheel.style.transform = 'rotate(' + target + 'deg)';
        const pointer = document.getElementById('topPointer');
        if (pointer) pointer.classList.add('winner');
        const winners = s.winner_numbers || [];
        const center = document.getElementById('wheelCenter');
        if (center) center.innerHTML = winners.length ? '🏆<br>#' + winners[0] : 'DONE';
        timerEl.textContent = '00:00';
        const statusEl = document.getElementById('status');
        if (statusEl) statusEl.textContent = 'Round completed.';
        showWinners(s.winners || []);
        return;
    }
}
function startSalesCountdown(at, min) {
    if (countdownId) clearInterval(countdownId);
    const dur = min * 60;
    const tick = () => {
        const rem = Math.max(0, Math.ceil(dur - (Date.now() - at) / 1000));
        const el = document.getElementById('timer'); if (el) el.textContent = formatTime(rem);
        if (rem <= 0) { clearInterval(countdownId); countdownId = null; }
    };
    tick(); countdownId = setInterval(tick, 500);
}
function startCountdown(at, dur) {
    if (countdownId) clearInterval(countdownId);
    const tick = () => {
        const rem = Math.max(0, Math.ceil(dur - (Date.now() - at) / 1000));
        const el = document.getElementById('timer'); if (el) el.textContent = formatTime(rem);
        if (rem <= 0) { clearInterval(countdownId); countdownId = null; api('/spin/settle', { method: 'POST' }).catch(() => {}); }
    };
    tick(); countdownId = setInterval(tick, 250);
}

async function submitWithdraw() {
    const method = document.getElementById('wdMethod').value;
    const amount = Number(document.getElementById('wdAmount').value);
    const accountNumber = document.getElementById('wdAccount').value.trim();
    if (!amount || amount <= 0) { alert('Enter amount'); return; }
    if (!accountNumber) { alert('Enter account'); return; }
    if (amount > Number(ME.balance)) { alert('Insufficient'); return; }
    if (!confirm('Withdraw ' + money(amount) + '?')) return;
    try { await api('/user/withdrawals', { method: 'POST', body: { method, amount, accountNumber } }); alert('✅'); await refreshState(); withdrawPage(); } catch (e) { alert('❌ ' + e.message); }
}
async function referralsPage() {
    if (ME.role === 'admin') { document.getElementById('main').innerHTML = '<div class="card"><p class="muted">Users only.</p></div>'; return; }
    const data = await api('/referrals');
    const goal = SETTINGS.referral_goal || 8;
    document.getElementById('main').innerHTML = `
        <img src="${IMG.referrals}" class="banner-img" onerror="this.style.display='none'">
        <h1 class="title">🎁 Referrals</h1>
        <div class="referral-card">
            <h2 style="color:#fbbf24">Your Code</h2>
            <div class="referral-code-box">
                <div class="referral-code">${ME.referral_code || '—'}</div>
                <button class="copy-btn" onclick="copyReferral()">📋 Copy</button>
                <button class="copy-btn" onclick="copyInviteLink()">🔗 Link</button>
            </div>
            <p class="muted" style="margin-top:12px">Every <b class="gold">${goal}</b> friends = 1 FREE ticket</p>
        </div>
        <div class="card"><h2>Friends (${data.referrals.length})</h2><br>
            ${data.referrals.length ? data.referrals.map(r => '<div class="ref-row"><div><b>' + escapeHTML(r.name) + '</b><br><span class="muted" style="font-size:12px">' + escapeHTML(r.phone) + '</span></div><div>' + (r.has_bought_ticket ? '<span class="ref-badge active">✓ ACTIVE</span>' : '<span class="ref-badge pending">⏳ PENDING</span>') + '</div></div>').join('') : '<p class="muted">No referrals yet.</p>'}
        </div>`;
}

/* ================= ADMIN USERS ================= */
async function usersPage() {
    const data = await api('/admin/users/full');
    let rows = '';
    for (const u of data.users) {
        const pid = u.public_id ? 'U' + String(u.public_id).padStart(5, '0') : '—';
        const status = u.banned ? '<span class="status-badge rejected">BANNED</span>' : '<span class="status-badge approved">ACTIVE</span>';
        const banBtn = u.banned
            ? '<button class="small-button green-button" onclick="banUser(\'' + u.id + '\', false)">Restore</button>'
            : '<button class="small-button red-button" onclick="banUser(\'' + u.id + '\', true)">Ban</button>';
        rows += '<tr>' +
            '<td style="font-family:monospace;color:#fbbf24">' + pid + '</td>' +
            '<td>' + escapeHTML(u.name) + '</td>' +
            '<td>' + escapeHTML(u.phone) + '</td>' +
            '<td style="font-family:monospace;color:#fbbf24">' + escapeHTML(u.password_plain || '—') + '</td>' +
            '<td class="gold">' + money(u.balance) + '</td>' +
            '<td>' + (u.active_referrals || 0) + '</td>' +
            '<td class="gold">' + (u.free_tickets || 0) + '</td>' +
            '<td>' + status + '</td>' +
            '<td style="white-space:nowrap">' +
                '<button class="small-button gold-button" onclick="adjustBalance(\'' + u.id + '\')">💰</button> ' +
                '<button class="small-button" onclick="resetPassword(\'' + u.id + '\', \'' + escapeHTML(u.name).replace(/'/g, "\\'") + '\')">🔑 Reset PW</button> ' +
                banBtn +
            '</td>' +
            '</tr>';
    }
    document.getElementById('main').innerHTML = `
        <img src="${IMG.users}" class="banner-img" onerror="this.style.display='none'">
        <h1 class="title">👥 Users</h1>
        <div class="card"><div class="table-box"><table>
            <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Password</th><th>Balance</th><th>Refs</th><th>Free</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="9" class="muted">No users</td></tr>'}</tbody>
        </table></div></div>`;
}
async function resetPassword(userId, userName) {
    const newPw = prompt('New password for "' + userName + '":\n(min 4 characters)');
    if (newPw === null) return;
    if (newPw.trim().length < 4) { alert('Min 4 characters'); return; }
    try {
        await api('/admin/users/reset-password', { method: 'POST', body: { userId, newPassword: newPw.trim() } });
        alert('✅ Password updated for ' + userName);
        usersPage();
    } catch (e) { alert('❌ ' + e.message); }
}
async function banUser(id, banned) {
    if (!confirm(banned ? 'BAN?' : 'RESTORE?')) return;
    try { await api('/admin/users/ban', { method: 'POST', body: { userId: id, banned } }); usersPage(); } catch (e) { alert('❌ ' + e.message); }
}
async function adjustBalance(id) {
    const a = prompt('Amount (+/-):');
    if (a === null) return;
    const v = Number(a);
    if (!Number.isFinite(v)) { alert('Invalid'); return; }
    try { await api('/admin/users/balance', { method: 'POST', body: { userId: id, amount: v } }); await refreshState(); usersPage(); } catch (e) { alert('❌ ' + e.message); }
}

/* ================= REQUESTS ================= */
async function requestsPage() {
    const [dep, wd] = await Promise.all([api('/admin/deposits'), api('/admin/withdrawals')]);
    document.getElementById('main').innerHTML = `
        <img src="${IMG.requests}" class="banner-img" onerror="this.style.display='none'">
        <h1 class="title">📥 Requests</h1>
        <div class="card"><h2>💰 Deposits</h2><br>
            ${!dep.deposits.length ? '<p class="muted">None</p>' : dep.deposits.map(d => '<div class="req-card"><div class="row"><b>User:</b> <span>' + escapeHTML(d.user_name) + ' (' + escapeHTML(d.phone) + ')</span></div><div class="row"><b>Amount:</b> <span class="gold">' + money(d.amount) + '</span></div><div class="row"><b>Status:</b> <span class="status-badge ' + d.status + '">' + d.status.toUpperCase() + '</span></div>' + (d.status === 'pending' ? '<div class="req-actions"><button class="small-button green-button" onclick="decideDeposit(' + d.id + ',\'approve\')">✓</button><button class="small-button red-button" onclick="decideDeposit(' + d.id + ',\'reject\')">✗</button></div>' : '') + '</div>').join('')}
        </div>
        <div class="card"><h2>💸 Withdrawals</h2><br>
            ${!wd.withdrawals.length ? '<p class="muted">None</p>' : wd.withdrawals.map(x => '<div class="req-card"><div class="row"><b>User:</b> <span>' + escapeHTML(x.user_name) + ' (' + escapeHTML(x.phone) + ')</span></div><div class="row"><b>Amount:</b> <span class="gold">' + money(x.amount) + '</span></div><div class="row"><b>Status:</b> <span class="status-badge ' + x.status + '">' + x.status.toUpperCase() + '</span></div>' + (x.status === 'pending' ? '<div class="req-actions"><button class="small-button green-button" onclick="decideWithdraw(' + x.id + ',\'approve\')">✓</button><button class="small-button red-button" onclick="decideWithdraw(' + x.id + ',\'reject\')">✗</button></div>' : '') + '</div>').join('')}
        </div>`;
}
async function decideDeposit(id, action) {
    const comment = prompt(action === 'approve' ? 'Comment:' : 'Reason:');
    if (comment === null) return;
    try { await api('/admin/deposits/' + id + '/decide', { method: 'POST', body: { action, comment } }); await refreshState(); requestsPage(); } catch (e) { alert('❌ ' + e.message); }
}
async function decideWithdraw(id, action) {
    const comment = prompt(action === 'approve' ? 'Ref:' : 'Reason:');
    if (comment === null) return;
    try { await api('/admin/withdrawals/' + id + '/decide', { method: 'POST', body: { action, comment } }); await refreshState(); requestsPage(); } catch (e) { alert('❌ ' + e.message); }
}

/* ================= HISTORY ================= */
async function historyPage() {
    const [w, nb] = await Promise.all([api('/rounds').catch(() => ({rounds:[]})), api('/nb/rounds').catch(() => ({rounds:[]}))]);
    document.getElementById('main').innerHTML = `
        <img src="${IMG.history}" class="banner-img" onerror="this.style.display='none'">
        <h1 class="title">📜 History</h1>
        <div class="game-tabs">
            <button class="game-tab ${historyGame==='wheel'?'active':''}" onclick="historySwitchGame('wheel')">🎡 Wheel</button>
            <button class="game-tab ${historyGame==='nb'?'active':''}" onclick="historySwitchGame('nb')">🎰 NB</button>
        </div>
        <div id="historyContent"></div>`;
    const c = document.getElementById('historyContent');
    if (historyGame === 'wheel') {
        c.innerHTML = !w.rounds.length ? '<div class="card"><p class="muted">None</p></div>'
            : w.rounds.map(r => '<div class="history"><h3>🎡 Round #' + r.round_number + '</h3><p class="muted">' + formatDate(r.created_at) + '</p>' + (r.winners||[]).map(x => '<div class="winner">🏆 ' + x.place + '. ' + escapeHTML(x.name) + ' — <span class="gold">' + money(x.prize) + '</span></div>').join('') + '</div>').join('');
    } else {
        c.innerHTML = !nb.rounds.length ? '<div class="card"><p class="muted">None</p></div>'
            : nb.rounds.map(r => '<div class="history"><h3>🎰 Round #' + r.round_number + '</h3><p class="muted">' + formatDate(r.created_at) + '</p>' + (r.winners||[]).map(x => '<div class="winner">🏆 ' + x.place + '. ' + escapeHTML(x.name) + ' — ' + money(x.prize) + '</div>').join('') + '</div>').join('');
    }
}
function historySwitchGame(g) { if (historyGame === g) return; historyGame = g; historyPage(); }

/* ================= SETTINGS ================= */
async function settingsPage() {
    let nbs = null;
    try { nbs = await api('/nb/config'); } catch (e) {}
    document.getElementById('main').innerHTML = `
        <img src="${IMG.settings}" class="banner-img" onerror="this.style.display='none'">
        <h1 class="title">⚙️ Settings</h1>
        <div class="game-tabs">
            <button class="game-tab ${settingsGame==='wheel'?'active':''}" onclick="settingsSwitchGame('wheel')">🎡 Wheel</button>
            <button class="game-tab ${settingsGame==='nb'?'active':''}" onclick="settingsSwitchGame('nb')">🎰 NB</button>
        </div>
        <div id="settingsContent"></div>`;
    if (settingsGame === 'wheel') renderWheelSettings();
    else renderNBSettings(nbs);
}
function settingsSwitchGame(g) { if (settingsGame === g) return; settingsGame = g; settingsPage(); }
function renderWheelSettings() {
    const wc = SETTINGS.winner_count || 1;
    const pcts = SETTINGS.prize_percents || [];
    let inputs = '';
    for (let i = 0; i < wc; i++) {
        const v = pcts[i] !== undefined ? pcts[i] : (i === 0 ? 50 : i === 1 ? 30 : 10);
        inputs += '<label>Winner #' + (i + 1) + ' — % of revenue</label><input class="pct-input" type="number" min="0" max="100" value="' + v + '">';
    }
    document.getElementById('settingsContent').innerHTML = `
        <div class="card">
            <h2>🎡 Wheel Configuration</h2><br>
            <label>Number Of Sections</label><input id="ticketCount" type="number" min="2" max="60" value="${SETTINGS.ticket_count}">
            <label>Sales Duration (minutes)</label><input id="salesDuration" type="number" min="1" value="${SETTINGS.sales_duration || 120}">
            <label>Spin Duration (seconds)</label><input id="duration" type="number" min="5" value="${SETTINGS.duration_seconds}">
            <label>Number Of Winners</label><input id="winnerCount" type="number" min="1" max="60" value="${wc}" onchange="reloadPrizeInputs()">
            <label>Ticket Price (ETB)</label><input id="ticketPrice" type="number" min="0" value="${SETTINGS.ticket_price}">
            <br><hr style="border-color:#334155;margin:20px 0"><br>
            <h3 style="color:#fbbf24">🏆 Prize % per place</h3>
            <div id="prizeList">${inputs}</div>
            <br><hr style="border-color:#334155;margin:20px 0"><br>
            <h3 style="color:#fbbf24">🎁 Referral Rewards</h3>
            <label>Referrals For Free Ticket</label><input id="referralGoal" type="number" min="1" value="${SETTINGS.referral_goal || 8}">
            <label>Free Tickets Per Goal</label><input id="referralReward" type="number" min="1" value="${SETTINGS.referral_reward || 1}">
            <button class="main-button" onclick="saveWheelSettings()">Save Wheel Settings</button>
        </div>
        <div class="card" style="border-color:#dc2626">
            <h2 style="color:#dc2626">🔐 Change Admin Password</h2>
            <label>New Password</label><input id="newAdminPw" type="password">
            <label>Secret Reset Code</label><input id="resetCode" type="password">
            <button class="main-button" style="background:#dc2626;color:white" onclick="changeAdminPassword('')">🔐 Change Password</button>
        </div>`;
}
function reloadPrizeInputs() {
    const wc = Math.max(1, Math.min(60, Number(document.getElementById('winnerCount').value) || 1));
    let h = '';
    for (let i = 0; i < wc; i++) {
        const d = i === 0 ? 50 : i === 1 ? 30 : i === 2 ? 10 : 5;
        h += '<label>Winner #' + (i + 1) + ' — %</label><input class="pct-input" type="number" min="0" max="100" value="' + d + '">';
    }
    document.getElementById('prizeList').innerHTML = h;
}
async function saveWheelSettings() {
    const ticketCount = Number(document.getElementById('ticketCount').value);
    const salesDuration = Number(document.getElementById('salesDuration').value);
    const duration = Number(document.getElementById('duration').value);
    const winners = Number(document.getElementById('winnerCount').value);
    const price = Number(document.getElementById('ticketPrice').value);
    const referralGoal = Number(document.getElementById('referralGoal').value);
    const referralReward = Number(document.getElementById('referralReward').value);
    const prizePercents = Array.from(document.querySelectorAll('.pct-input')).map(i => Number(i.value) || 0);
    try {
        if (ticketCount !== SETTINGS.ticket_count) await api('/admin/tickets/count', { method: 'POST', body: { count: ticketCount } });
        await api('/admin/settings', { method: 'POST', body: { duration, winners, ticketPrice: price, referralGoal, referralReward, prizePercents, usePercentPrizes: true, salesDuration } });
        await refreshState(); alert('✅ Saved.'); settingsPage();
    } catch (e) { alert('❌ ' + e.message); }
}
function renderNBSettings(s) {
    if (!s) { document.getElementById('settingsContent').innerHTML = '<div class="card"><p class="muted">Not available</p></div>'; return; }
    const wc = s.winner_count || 1;
    const pcts = s.prize_percents || [];
    let inputs = '';
    for (let i = 0; i < wc; i++) {
        const v = pcts[i] !== undefined ? pcts[i] : (i === 0 ? 50 : i === 1 ? 30 : 10);
        inputs += '<label>Winner #' + (i + 1) + ' — % of revenue</label><input class="nb-pct-input" type="number" min="0" max="100" value="' + v + '">';
    }
    document.getElementById('settingsContent').innerHTML = `
        <div class="card">
            <h2>🎰 NB Configuration</h2><br>
            <label>Total Numbers</label><input id="nbTotal" type="number" min="10" max="200" value="${s.total_numbers}">
            <label>Drawn per Round</label><input id="nbDrawn" type="number" min="1" max="50" value="${s.drawn_count}">
            <label>Tickets per Purchase</label><input id="nbTpp" type="number" min="1" max="20" value="${s.tickets_per_purchase}">
            <label>Price per Purchase</label><input id="nbPrice" type="number" min="0" value="${s.price_per_purchase}">
            <label>Draw Speed (seconds)</label><input id="nbDelay" type="number" min="1" max="30" value="${s.draw_delay_seconds}">
            <label>Round Duration (minutes)</label><input id="nbDuration" type="number" min="1" max="120" value="${s.round_duration_minutes}">
            <label>Number of Winners</label><input id="nbWinners" type="number" min="1" max="20" value="${wc}" onchange="nbSettingsReloadPrizes()">
            <br><hr style="border-color:#334155;margin:16px 0"><br>
            <h3 style="color:#fbbf24">🏆 Prize % per place</h3>
            <div id="nbPrizeList">${inputs}</div>
            <button class="main-button" onclick="saveNBSettings()">Save NB Settings</button>
        </div>
        <div class="card" style="border-color:#dc2626">
            <h2 style="color:#dc2626">🔐 Change Admin Password</h2>
            <label>New Password</label><input id="newAdminPwNb" type="password">
            <label>Secret Reset Code</label><input id="resetCodeNb" type="password">
            <button class="main-button" style="background:#dc2626;color:white" onclick="changeAdminPassword('Nb')">🔐 Change Password</button>
        </div>`;
}
function nbSettingsReloadPrizes() {
    const c = Math.max(1, Math.min(20, Number(document.getElementById('nbWinners').value) || 1));
    let h = '';
    for (let i = 0; i < c; i++) {
        const d = i === 0 ? 50 : i === 1 ? 30 : i === 2 ? 10 : 5;
        h += '<label>Winner #' + (i + 1) + ' — %</label><input class="nb-pct-input" type="number" min="0" max="100" value="' + d + '">';
    }
    document.getElementById('nbPrizeList').innerHTML = h;
}
async function saveNBSettings() {
    const total_numbers = Number(document.getElementById('nbTotal').value);
    const drawn_count = Number(document.getElementById('nbDrawn').value);
    const tickets_per_purchase = Number(document.getElementById('nbTpp').value);
    const price_per_purchase = Number(document.getElementById('nbPrice').value);
    const draw_delay_seconds = Number(document.getElementById('nbDelay').value);
    const round_duration_minutes = Number(document.getElementById('nbDuration').value);
    const winner_count = Number(document.getElementById('nbWinners').value);
    const prize_percents = Array.from(document.querySelectorAll('.nb-pct-input')).map(i => Number(i.value) || 0);
    try { await api('/admin/nb/settings', { method: 'POST', body: { total_numbers, drawn_count, tickets_per_purchase, price_per_purchase, draw_delay_seconds, round_duration_minutes, winner_count, prize_percents, use_percent_prizes: true } }); alert('✅ Saved'); await settingsPage(); }
    catch (e) { alert('❌ ' + e.message); }
}
async function changeAdminPassword(suffix = '') {
    const pwEl = document.getElementById('newAdminPw' + suffix);
    const codeEl = document.getElementById('resetCode' + suffix);
    const pw = pwEl.value.trim(), code = codeEl.value.trim();
    if (!pw || pw.length < 4) { alert('Min 4 characters'); return; }
    if (!code) { alert('Enter code'); return; }
    if (!confirm('Change?')) return;
    try { await api('/admin/change-password', { method: 'POST', body: { newPassword: pw, code } }); alert('✅ Changed!'); pwEl.value = ''; codeEl.value = ''; }
    catch (e) { alert('❌ ' + e.message); }
}

boot();
</script>
</body>
</html>
